name: Weekly gates

# Mondays, after Source watch: the checks a pull request can't see in full.
# The pull request checks look at the files a change touched; this run looks
# at everything on main, so it also catches a direct push, and it judges the
# evidence maps against today's date, so a link going stale or an agreement
# term coming due shows up without anyone editing the map. Findings go into
# one open issue, updated each week and closed when a run is clean.

on:
  schedule:
    - cron: "30 11 * * 1" # Mondays 11:30 UTC, after Source watch at 11:00
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-gates
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_TITLE: "Weekly gates: findings"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-yaml python3-jsonschema

      - name: Run the gates
        # Each gate's exit code is kept; a failing gate doesn't stop the others.
        run: |
          mkdir -p _gates
          set +e
          python3 scripts/check_neutrality.py > _gates/neutrality.txt 2>&1; echo $? > _gates/neutrality.rc
          python3 scripts/check_evidence_maps.py --check --as-of "$(date -u +%F)" > _gates/maps.txt 2>&1; echo $? > _gates/maps.rc
          cat _gates/neutrality.txt _gates/maps.txt

      - name: Report
        run: |
          n_rc=$(cat _gates/neutrality.rc); m_rc=$(cat _gates/maps.rc)
          warnings=$(grep -c "warning:" _gates/maps.txt || true)
          issue=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
                  --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ "$n_rc" = 0 ] && [ "$m_rc" = 0 ] && [ "$warnings" = 0 ]; then
            echo "All gates clean."
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "Clean on $(date -u +%F) (run ${GITHUB_RUN_ID})."
            fi
            exit 0
          fi
          {
            echo "Weekly gates on $(date -u +%F), run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "## Agency neutrality ($([ "$n_rc" = 0 ] && echo clean || echo FAIL))"
            echo
            echo '```text'; cat _gates/neutrality.txt; echo '```'
            echo
            echo "## Evidence maps ($([ "$m_rc" = 0 ] && echo "no errors, $warnings warning(s)" || echo FAIL))"
            echo
            echo '```text'; cat _gates/maps.txt; echo '```'
            echo
            echo "Neutrality hits name the file and line only. Rewrite the line in neutral terms, or, for a line"
            echo "that has to stay (an old redirect alias), add it to \`data/neutrality-baseline.txt\` in a reviewed PR."
          } > _gates/body.md
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file _gates/body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file _gates/body.md
          fi
          # A hard failure fails the run too, so it shows red in Actions; warnings alone don't.
          [ "$n_rc" = 0 ] && [ "$m_rc" = 0 ]

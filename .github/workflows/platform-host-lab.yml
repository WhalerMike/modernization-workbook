# Platform host lab: build a disposable lab host on a fresh GitHub-hosted Windows Server 2025 runner and run the
# kit's read-only interface check against it.
#
# examples/platform-host/lab/Build-PhLabHost.ps1 installs IIS, URL Rewrite, ARR and Gitea (single-host SQLite
# profile) from the pinned release manifest, then the kit's collectors run in the edition each declares (Windows
# PowerShell 5.1 for the Windows side, PowerShell 7.6 for Gitea's API) and the check runs in both. A drift step
# turns on a second listener, shows the finding, and turns it off again. The outputs come back as the
# "platform-host-lab" artifact; the implementation guide quotes them, and a person commits any change to them.
# The runner has no domain and no tenant, so directory and Entra sign-in and Azure Arc aren't part of the lab.
#
# Runs by hand (Actions > Platform host lab > Run workflow), on pull requests that change the kit, and on pushes
# of kit changes to any branch but main.
name: Platform host lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - examples/platform-host/**
      - .github/workflows/platform-host-lab.yml
  push:
    branches-ignore: [main]
    paths:
      - examples/platform-host/**
      - .github/workflows/platform-host-lab.yml

permissions:
  contents: read

concurrency:
  group: platform-host-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      KIT: ${{ github.workspace }}\examples\platform-host
      OUT: C:\FMWLabs\results\platform-host
    steps:
      - uses: actions/checkout@v4

      - name: Editions and operating system on this runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:OUT\console" | Out-Null
          & {
            "PowerShell 7: $($PSVersionTable.PSVersion)"
            powershell -NoProfile -Command '"Windows PowerShell: $($PSVersionTable.PSVersion)"'
            (Get-CimInstance Win32_OperatingSystem | ForEach-Object { "$($_.Caption) $($_.Version)" })
            git --version
          } | Tee-Object -FilePath "$env:OUT\console\00-runner.txt"

      - name: Build the lab host (Windows PowerShell 5.1, as administrator)
        shell: powershell
        run: |
          & "$env:KIT\lab\Build-PhLabHost.ps1" *>&1 | Tee-Object -FilePath "$env:OUT\console\01-build.txt"

      - name: Windows snapshot (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Set-Location $env:KIT
          .\Get-PhWindowsSnapshot.ps1 -SettingsPath .\config\settings.lab.json -OutputPath "$env:OUT\run\snapshot-windows.json" *>&1 | Tee-Object -FilePath "$env:OUT\console\02-windows-snapshot.txt"

      - name: Gitea snapshot (PowerShell 7.6)
        shell: pwsh
        run: |
          Set-Location $env:KIT
          $env:PH_GITEA_TOKEN = (Get-Content -Raw C:\FMPLab\state\check-token.txt).Trim()
          "::add-mask::$env:PH_GITEA_TOKEN"
          ./Get-PhGiteaSnapshot.ps1 -SettingsPath ./config/settings.lab.json -OutputPath "$env:OUT\run\snapshot-gitea.json" *>&1 | Tee-Object -FilePath "$env:OUT\console\03-gitea-snapshot.txt"

      - name: Interface check (Windows PowerShell 5.1), recorded as evidence
        shell: powershell
        run: |
          Set-Location $env:KIT
          .\Test-PhInterfaces.ps1 -SettingsPath .\config\settings.lab.json -RunPath "$env:OUT\run" -EvidencePath "$env:OUT\evidence" *>&1 | Tee-Object -FilePath "$env:OUT\console\04-check-ps51.txt"
          "exit $LASTEXITCODE" | Tee-Object -FilePath "$env:OUT\console\04-check-ps51.txt" -Append
          exit 0

      - name: Interface check (PowerShell 7.6), same snapshots
        shell: pwsh
        run: |
          Set-Location $env:KIT
          ./Test-PhInterfaces.ps1 -SettingsPath ./config/settings.lab.json -RunPath "$env:OUT\run" *>&1 | Tee-Object -FilePath "$env:OUT\console\05-check-ps76.txt"
          "exit $LASTEXITCODE" | Tee-Object -FilePath "$env:OUT\console\05-check-ps76.txt" -Append
          exit 0

      - name: Smoke test through IIS (clone, push a branch) and Gitea's SSH listener
        shell: pwsh
        run: |
          $token = (Get-Content -Raw C:\FMPLab\state\check-token.txt).Trim()
          "::add-mask::$token"
          $pw = (Get-Content -Raw C:\FMPLab\state\lab-admin.txt).Trim()
          "::add-mask::$pw"
          & {
            $work = Join-Path $env:RUNNER_TEMP 'smoke'
            New-Item -ItemType Directory -Force -Path $work | Out-Null
            Set-Location $work
            git -c http.sslVerify=false clone "https://lab-admin:$pw@git.fmp.lab.contoso.test/fmp/canon.git" 2>&1 | ForEach-Object { "$_" -replace [regex]::Escape($pw), '***' }
            Set-Location canon
            git config user.name 'Lab Admin'; git config user.email 'lab-admin@fmp.lab.contoso.test'
            git switch -c feature/smoke-test 2>&1 | ForEach-Object { "$_" }
            Set-Content -Path smoke.txt -Value 'smoke test'
            git add smoke.txt; git commit -m 'Smoke test through IIS' | Select-Object -First 1
            git -c http.sslVerify=false push origin feature/smoke-test 2>&1 | ForEach-Object { "$_" -replace [regex]::Escape($pw), '***' }
            "main is protected: a direct push is refused"
            git switch main 2>&1 | Out-Null
            Add-Content -Path README.md -Value 'direct push'
            git commit -am 'Direct push to main' | Select-Object -First 1
            git -c http.sslVerify=false push origin main 2>&1 | ForEach-Object { "$_" -replace [regex]::Escape($pw), '***' }
            "SSH host key on 2222:"
            ssh-keyscan -p 2222 -t ed25519,rsa git.fmp.lab.contoso.test 2>$null | ForEach-Object { ($_ -split ' ')[0..1] -join ' ' }
          } | Tee-Object -FilePath "$env:OUT\console\06-smoke.txt"
          exit 0

      - name: Drift - start the Default Web Site (port 80), check, then stop it again
        shell: powershell
        run: |
          Set-Location $env:KIT
          & {
            Import-Module WebAdministration
            Start-Website -Name 'Default Web Site'
            "Default Web Site started"
            New-Item -ItemType Directory -Force -Path "$env:OUT\drift" | Out-Null
            Copy-Item "$env:OUT\run\snapshot-gitea.json" "$env:OUT\drift\"
            .\Get-PhWindowsSnapshot.ps1 -SettingsPath .\config\settings.lab.json -OutputPath "$env:OUT\drift\snapshot-windows.json" | Out-Null
            .\Test-PhInterfaces.ps1 -SettingsPath .\config\settings.lab.json -RunPath "$env:OUT\drift"
            "exit $LASTEXITCODE"
            Stop-Website -Name 'Default Web Site'
            "Default Web Site stopped"
          } *>&1 | Tee-Object -FilePath "$env:OUT\console\07-drift.txt"
          exit 0

      - name: Evidence folder check
        shell: powershell
        run: |
          Import-Module "$env:KIT\powershell\PlatformHost\PlatformHost.psm1"
          Test-PhEvidence -EvidencePath "$env:OUT\evidence" | ForEach-Object { '{0,-6} {1,-8} {2}' -f $_.Check, $_.Status, $_.Detail } | Tee-Object -FilePath "$env:OUT\console\08-evidence.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-host-lab
          path: C:\FMWLabs\results\platform-host\
          if-no-files-found: error

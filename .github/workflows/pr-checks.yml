name: Pull request checks

# Tiered pre-merge check (scripts/check_changed.py). A pull request that edits
# a few pages renders and checks just those pages and builds the Word bundles
# that contain them; one that touches the site configuration, filters, theme,
# build scripts, an included file, a listing page, the video manifest, or
# renames or deletes a page, or edits more than 25 pages, runs the deploy
# workflow's full build (without deploying). Changes the site doesn't publish
# run only the checks that apply to them. A change to an example kit runs
# that kit's Pester and pytest suites (scripts/run_example_tests.py), on
# Linux. Read-only: no Pages, no secrets.

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      force_full:
        description: "Run the FULL tier whatever changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # origin/main for a manual run, where there is no pull request base.
      BASE_REF: ${{ github.base_ref || 'main' }}
      FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full commit history (no file contents): the diff needs the merge base,
          # and the books table dates each book from git log, as in the deploy.
          fetch-depth: 0
          filter: blob:none

      - name: Install dependencies
        # pytest and the packages the example kits' Python suites import.
        run: >-
          sudo apt-get update && sudo apt-get install -y librsvg2-bin python3-yaml python3-jsonschema
          python3-pytest python3-cryptography python3-requests

      - name: Pester 5
        # pwsh is on the runner image; the example kits' Pester suites need Pester 5 or later.
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0.0')) {
            Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          (Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1).Version.ToString()

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Copy reference doc to docs directory
        # As the deploy does, for the FULL tier's per-page DOCX render.
        run: |
          mkdir -p docs/assets docs/compliance/assets docs/compliance/day2-kit/assets
          cp assets/reference-mslearn.docx docs/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/assets/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/assets/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/day2-kit/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/day2-kit/assets/reference-mslearn.docx

      - name: Run the tiered check
        # The script prints the tier, the reason and every check's result, and
        # writes the summary to $GITHUB_STEP_SUMMARY.
        run: |
          args=(--base "origin/$BASE_REF" --committed-only)
          if [ "$FORCE_FULL" = "true" ]; then args+=(--force-full); fi
          python3 scripts/check_changed.py "${args[@]}"

      - name: Keep the rendered pages
        # The CHANGED and FULL tiers render into _site/. Keep it for a week, so the pages
        # can be looked at without a local render. The Word bundles and kit zips are left out.
        id: rendered
        if: always() && hashFiles('_site/**/*.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rendered-pages
          path: |
            _site
            !_site/downloads
          retention-days: 7
          if-no-files-found: ignore

      - name: Link the rendered pages
        if: always() && steps.rendered.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.rendered.outputs.artifact-url }}
        run: |
          pages=$(cd _site && find . -name '*.html' -not -path './site_libs/*' | sed 's|^\./||' | sort)
          n=$(printf '%s\n' "$pages" | grep -c . || true)
          {
            echo "## Rendered pages"
            echo
            echo "[Download the rendered pages]($ARTIFACT_URL) ($n page(s), kept 7 days). Unzip it and open a page in a browser."
            echo
            printf '%s\n' "$pages" | head -50 | sed 's|^|- `|; s|$|`|'
            if [ "$n" -gt 50 ]; then echo "- … and $((n - 50)) more"; fi
          } >> "$GITHUB_STEP_SUMMARY"

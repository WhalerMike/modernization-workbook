name: Deploy Quarto Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render DOCX to temporary directory
        run: |
          quarto render --to docx --output-dir _docx
          mkdir -p _site

      - name: Render HTML
        run: quarto render --to html

      - name: Copy DOCX files into site
        run: |
          find _docx -name '*.docx' | while read f; do
            rel="${f#_docx/}"
            dest="_site/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done

      - name: Create series ZIPs and combined bundle
        run: |
          mkdir -p _site/downloads

          # DOCX-only bundles for each series
          for series in architecture executive-briefs executive-governance modernization-specs                         reference-architecture operational-guides case-studies whitepapers                         compliance sql-server-implementation ssot-network-physics substrate                         modernization client-server-to-hybrid-cloud; do
            src="_docx/docs/${series}"
            if [ -d "$src" ]; then
              echo "Creating bundle for $series"
              (cd "$src" && zip -r "/tmp/${series}-series.zip" *.docx 2>/dev/null || true)
              if [ -f "/tmp/${series}-series.zip" ]; then
                cp "/tmp/${series}-series.zip" _site/downloads/
                echo "Created ${series}-series.zip"
              fi
            fi
          done

          # SQL Server narrative series ZIP — DOCX only
          if [ -d _docx/docs/case-studies/sql-server-narrative ]; then
            (cd _docx/docs/case-studies/sql-server-narrative && zip -r /tmp/sql-server-narrative-series.zip *.docx 2>/dev/null || true)
            cp /tmp/sql-server-narrative-series.zip _site/downloads/ 2>/dev/null || true
          fi

          # Combined series bundle DOCX (concatenate rendered books)
          if command -v pandoc >/dev/null && [ -d _docx/docs/case-studies/sql-server-narrative ]; then
            mkdir -p /tmp/bundle-src
            echo "Looking for DOCX files in _docx/docs/case-studies/sql-server-narrative/"
            ls _docx/docs/case-studies/sql-server-narrative/*.docx 2>/dev/null | head -5 || echo "No DOCX files found"
            # Order: index, then books 01-10 with chapters
            for f in index Book_01 Book_01_CPT_01 Book_01_CPT_02 Book_02 Book_02_CPT_01 Book_02_CPT_02 \
                     Book_02_CPT_03 Book_02_CPT_04 Book_03 Book_03_CPT_01 Book_03_CPT_02 \
                     Book_04 Book_04_CPT_01 Book_04_CPT_02 Book_05 Book_05_CPT_01 Book_05_CPT_02 \
                     Book_06 Book_06_CPT_01 Book_06_CPT_02 Book_07 Book_07_CPT_01 Book_07_CPT_02 \
                     Book_08 Book_08_CPT_01 Book_08_CPT_02 Book_09 Book_09_CPT_01 Book_09_CPT_02 \
                     Book_10 Book_10_CPT_01; do
              src="_docx/docs/case-studies/sql-server-narrative/${f}.docx"
              if [ -f "$src" ]; then
                echo "Converting $src"
                pandoc "$src" -o "/tmp/bundle-src/${f}.md" || echo "Failed to convert $src"
              else
                echo "Missing: $src"
              fi
            done
            if ls /tmp/bundle-src/*.md >/dev/null 2>&1; then
              echo "Combining $(ls /tmp/bundle-src/*.md | wc -l) files"
              cat /tmp/bundle-src/*.md > /tmp/bundle-src/combined.md
              pandoc /tmp/bundle-src/combined.md -o _site/downloads/sql-server-narrative-bundle.docx \
                --reference-doc=assets/reference-mslearn.docx && echo "Bundle created" || \
              (pandoc /tmp/bundle-src/combined.md -o _site/downloads/sql-server-narrative-bundle.docx && echo "Bundle created without reference doc")
            else
              echo "No markdown files to combine"
            fi
          else
            echo "pandoc not found or _docx directory missing"
          fi

          # Client-server series
          if [ -d docs/client-server-to-hybrid-cloud ]; then
            (cd docs/client-server-to-hybrid-cloud && zip -r ../../_site/downloads/client-server-to-hybrid-cloud-series.zip *.md 2>/dev/null || true)
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Quarto Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Copy reference doc to docs directory
        run: |
          mkdir -p docs/assets docs/compliance/assets docs/compliance/day2-kit/assets
          cp assets/reference-mslearn.docx docs/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/assets/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/assets/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/day2-kit/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/day2-kit/assets/reference-mslearn.docx

      - name: Generate site map
        # Quarto resolves the include in sitemap.qmd before any pre-render
        # script runs, so the tree must exist before the first render.
        run: python3 scripts/generate_sitemap.py

      - name: Render DOCX to temporary directory
        run: |
          quarto render --to docx --output-dir _docx
          mkdir -p _site

      - name: Render HTML
        run: quarto render --to html

      - name: Copy DOCX files into site
        run: |
          find _docx -name '*.docx' | while read f; do
            rel="${f#_docx/}"
            dest="_site/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done

      - name: Create series ZIPs and combined bundle
        run: |
          mkdir -p _site/downloads

          # DOCX-only bundles for each series
          for series in architecture executive-briefs executive-governance modernization-specs                         reference-architecture operational-guides case-studies whitepapers                         compliance sql-server-implementation ssot-network-physics substrate                         modernization client-server-to-hybrid-cloud; do
            src="_docx/docs/${series}"
            if [ -d "$src" ]; then
              echo "Creating bundle for $series"
              (cd "$src" && zip -r "/tmp/${series}-series.zip" *.docx 2>/dev/null || true)
              if [ -f "/tmp/${series}-series.zip" ]; then
                cp "/tmp/${series}-series.zip" _site/downloads/
                echo "Created ${series}-series.zip"
              fi
            fi
          done

          # SQL Server narrative series ZIP — DOCX only
          if [ -d _docx/docs/case-studies/sql-server-narrative ]; then
            (cd _docx/docs/case-studies/sql-server-narrative && zip -r /tmp/sql-server-narrative-series.zip *.docx 2>/dev/null || true)
            cp /tmp/sql-server-narrative-series.zip _site/downloads/ 2>/dev/null || true
          fi

          # Combined SQL Server narrative bundle DOCX.
          # Built straight from the source Markdown in reading order. (The old
          # approach converted each rendered .docx back to Markdown and joined
          # the files with `cat`; every file ended in a table with no blank
          # line after it, so pandoc swallowed the next file's opening lines
          # into that table, chopping text and breaking every figure.)
          # Passing the files to pandoc as separate inputs keeps them apart.
          # Reading order: series index, then each Book_NN page followed by its
          # Book_NN_CPT_* chapters (globbed, so added chapters are picked up),
          # then Book 11, which exists only as book-11-platform-question.md.
          narrative=docs/case-studies/sql-server-narrative
          bundle_files="$narrative/index.md"
          for book in $(cd "$narrative" && ls Book_[0-9][0-9].md | sort); do
            n="${book%.md}"
            bundle_files="$bundle_files $narrative/$book"
            for ch in $(cd "$narrative" && ls ${n}_CPT_[0-9][0-9].md 2>/dev/null | sort); do
              bundle_files="$bundle_files $narrative/$ch"
            done
          done
          if [ -f "$narrative/book-11-platform-question.md" ]; then
            bundle_files="$bundle_files $narrative/book-11-platform-question.md"
          fi
          echo "SQL narrative bundle inputs:"; printf '  %s\n' $bundle_files
          quarto pandoc $bundle_files \
            --from markdown \
            --output _site/downloads/sql-server-narrative-bundle.docx \
            --metadata title="SQL Server Identity Transformation" \
            --metadata subtitle="Narrative Series — combined edition" \
            --toc --toc-depth=2 \
            --resource-path="$narrative" \
            --lua-filter=scripts/bundle-strip-nav.lua \
            --reference-doc=assets/reference-mslearn.docx
          echo "Created sql-server-narrative-bundle.docx"

          # Client-server series
          if [ -d docs/client-server-to-hybrid-cloud ]; then
            (cd docs/client-server-to-hybrid-cloud && zip -r ../../_site/downloads/client-server-to-hybrid-cloud-series.zip *.md 2>/dev/null || true)
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

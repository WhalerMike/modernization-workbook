name: Deploy Quarto Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin python3-yaml

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Copy reference doc to docs directory
        run: |
          mkdir -p docs/assets docs/compliance/assets docs/compliance/day2-kit/assets
          cp assets/reference-mslearn.docx docs/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/assets/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/assets/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/day2-kit/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/day2-kit/assets/reference-mslearn.docx

      - name: Generate site map
        # Quarto resolves the include in sitemap.qmd before any pre-render
        # script runs, so the tree must exist before the first render.
        run: python3 scripts/generate_sitemap.py

      - name: Render DOCX to temporary directory
        run: |
          quarto render --to docx --output-dir _docx
          mkdir -p _site

      - name: Render HTML
        run: quarto render --to html

      - name: Copy DOCX files into site
        run: |
          find _docx -name '*.docx' | while read f; do
            rel="${f#_docx/}"
            dest="_site/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done

      - name: Create downloads folder
        # The site publishes only the workbook books; their Word editions are
        # built by the next step. (The old per-series ZIPs went with the
        # unpublished pages.)
        run: mkdir -p _site/downloads

      - name: Build Word bundles
        # Every downloads/*.docx bundle, built directly from the source
        # Markdown. Manifests live in scripts/bundles.yml. Fails on a missing
        # image or on a download link with no matching bundle.
        run: python3 scripts/build_bundles.py --out _site/downloads

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

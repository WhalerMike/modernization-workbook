name: Deploy Quarto Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full commit history (no file contents) so the books table can
          # date each book's latest change; see scripts/generate_book_metrics.py.
          fetch-depth: 0
          filter: blob:none

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin python3-yaml

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Copy reference doc to docs directory
        run: |
          mkdir -p docs/assets docs/compliance/assets docs/compliance/day2-kit/assets
          cp assets/reference-mslearn.docx docs/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/assets/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/assets/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/day2-kit/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/day2-kit/assets/reference-mslearn.docx

      - name: Generate command reference
        # docs/reference/commands.md includes the generated body, and Quarto
        # resolves includes before any pre-render script runs. It goes before
        # the site map, whose `quarto inspect` needs every include to exist.
        run: python3 scripts/command_reference.py

      - name: Generate site map
        # Quarto resolves the include in sitemap.qmd before any pre-render
        # script runs, so the tree must exist before the first render.
        run: python3 scripts/generate_sitemap.py

      - name: Render DOCX to temporary directory
        run: |
          quarto render --to docx --output-dir _docx
          mkdir -p _site

      - name: Render HTML
        run: quarto render --to html

      - name: Copy DOCX files into site
        run: |
          find _docx -name '*.docx' | while read f; do
            rel="${f#_docx/}"
            dest="_site/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done

      - name: Create downloads folder
        # The site publishes only the workbook books; their Word editions are
        # built by the next step. (The old per-series ZIPs went with the
        # unpublished pages.)
        run: mkdir -p _site/downloads

      - name: Build Word bundles
        # Every downloads/*.docx bundle, built directly from the source
        # Markdown. Manifests live in scripts/bundles.yml. Fails on a missing
        # image or on a download link with no matching bundle.
        run: python3 scripts/build_bundles.py --out _site/downloads

      - name: Build the Start Kit download
        # downloads/start-kit.zip: examples/start-kit as committed, linked from the home
        # page, Book 00 Chapter 08, Book 02 Chapters 04 and Appendix B, Book 06 Runbooks
        # R01 and R02, and Book 09 Chapter 07.
        run: python3 scripts/build_start_kit_zip.py --out _site/downloads

      - name: Build the Copilot agent pack download
        # downloads/copilot-agent-pack.zip: examples/copilot-agent-pack as committed,
        # linked from Book 15 Chapter 13 and the Downloads page.
        run: python3 scripts/build_start_kit_zip.py --kit copilot-agent-pack --out _site/downloads

      - name: Build the application modernization reference download
        # downloads/app-modernization.zip: examples/app-modernization as committed,
        # linked from the Downloads page.
        run: python3 scripts/build_start_kit_zip.py --kit app-modernization --out _site/downloads

      - name: Build the Ansible examples download
        # downloads/ansible-examples.zip: examples/ansible as committed, linked from the
        # Ansible companion guide and the Downloads page.
        run: python3 scripts/build_start_kit_zip.py --kit ansible --out _site/downloads

      - name: Build the validation kit download
        # downloads/validation-kit.zip: examples/validation-kit as committed, linked from
        # the track implementation guides, the Attribute-Driven Migration guide, Book 05
        # Chapter 10 and the Downloads page.
        run: python3 scripts/build_start_kit_zip.py --kit validation-kit --out _site/downloads

      - name: Build the Attribute-Driven Migration code download
        # downloads/attribute-driven-migration-code.zip: the examples folders the nine
        # chapters of the developer workbook Building the Attribute-Driven Migration build
        # on, with the pinned Microsoft samples (BUNDLES in build_start_kit_zip.py), linked
        # from that workbook's landing page and the Downloads page.
        run: python3 scripts/build_start_kit_zip.py --kit attribute-driven-migration-code --out _site/downloads

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

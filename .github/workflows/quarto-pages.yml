name: Deploy Quarto Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render HTML site
        run: quarto render --to html

      - name: Render DOCX
        run: quarto render --to docx

      - name: Create series ZIPs
        run: |
          mkdir -p _site/downloads
          # SQL Server narrative series
          if [ -d docs/case-studies/sql-server-narrative ]; then
            cd docs/case-studies/sql-server-narrative
            zip -r ../../../_site/downloads/sql-server-narrative-series.zip *.md *.docx 2>/dev/null || true
            cd -
          fi
          # Client-server series
          if [ -d docs/client-server-to-hybrid-cloud ]; then
            cd docs/client-server-to-hybrid-cloud
            zip -r ../../_site/downloads/client-server-to-hybrid-cloud-series.zip *.md 2>/dev/null || true
            cd -
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

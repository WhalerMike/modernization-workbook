name: Deploy Quarto Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full commit history (no file contents) so the books table can
          # date each book's latest change; see scripts/generate_book_metrics.py.
          fetch-depth: 0
          filter: blob:none

      - name: Install dependencies
        run: bash .github/scripts/install-deps.sh librsvg2-bin python3-yaml

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Copy reference doc to docs directory
        run: |
          mkdir -p docs/assets docs/compliance/assets
          cp assets/reference-mslearn.docx docs/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/assets/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/reference-mslearn.docx
          cp assets/reference-mslearn.docx docs/compliance/assets/reference-mslearn.docx

      - name: Generate command reference
        # docs/reference/commands.md includes the generated body, and Quarto
        # resolves includes before any pre-render script runs. It goes before
        # the site map, whose `quarto inspect` needs every include to exist.
        run: python3 scripts/command_reference.py

      - name: Generate site map
        # Quarto resolves the include in workbook-map.qmd before any pre-render
        # script runs, so the tree must exist before the first render.
        run: python3 scripts/generate_workbook_map.py

      - name: Render DOCX to temporary directory
        run: |
          quarto render --to docx --output-dir _docx
          mkdir -p _site

      - name: Render HTML
        run: quarto render --to html

      - name: Copy DOCX files into site
        run: |
          find _docx -name '*.docx' | while read f; do
            rel="${f#_docx/}"
            dest="_site/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done

      - name: Create downloads folder
        # The site publishes only the workbook books; their Word editions are
        # built by the next step. (The old per-series ZIPs went with the
        # unpublished pages.)
        run: mkdir -p _site/downloads

      - name: Build Word bundles
        # Every downloads/*.docx bundle, built directly from the source
        # Markdown. Manifests live in scripts/bundles.yml. Fails on a missing
        # image or on a download link with no matching bundle.
        # --chapters _site: every page in a bundle also gets its own Word file,
        # built the same way, written over Quarto's per-page render at
        # _site/<page>.docx (the page's "Other Formats > MS Word" link). It runs
        # after "Copy DOCX files into site" so the chapter file wins.
        run: python3 scripts/build_bundles.py --out _site/downloads --chapters _site

      - name: Build the Start Kit download
        # downloads/start-kit.zip: examples/start-kit as committed, linked from the home
        # page, Book 00 Chapter 08, Book 02 Chapters 04 and Appendix B, Book 06 Runbooks
        # R01 and R02, and Book 09 Chapter 07.
        run: python3 scripts/build_start_kit_zip.py --out _site/downloads

      - name: Build the Copilot agent pack download
        # downloads/copilot-agent-pack.zip: examples/copilot-agent-pack as committed,
        # linked from Book 15 Chapter 13 and the Downloads page.
        run: python3 scripts/build_start_kit_zip.py --kit copilot-agent-pack --out _site/downloads

      - name: Build the application modernization reference download
        # downloads/app-modernization.zip: examples/app-modernization as committed,
        # linked from the Downloads page.
        run: python3 scripts/build_start_kit_zip.py --kit app-modernization --out _site/downloads

      - name: Build the Ansible examples download
        # downloads/ansible-examples.zip: examples/ansible as committed, linked from the
        # Ansible companion guide and the Downloads page.
        run: python3 scripts/build_start_kit_zip.py --kit ansible --out _site/downloads

      - name: Build the validation kit download
        # downloads/validation-kit.zip: examples/validation-kit as committed, linked from
        # the track implementation guides, the Attribute-Driven Migration guide, Book 05
        # Chapter 10 and the Downloads page.
        run: python3 scripts/build_start_kit_zip.py --kit validation-kit --out _site/downloads

      - name: Build the Attribute-Driven Migration code download
        # downloads/attribute-driven-migration-code.zip: the examples folders the nine
        # chapters of the developer workbook Building the Attribute-Driven Migration build
        # on, with the pinned Microsoft samples (BUNDLES in build_start_kit_zip.py), linked
        # from that workbook's landing page and the Downloads page.
        run: python3 scripts/build_start_kit_zip.py --kit attribute-driven-migration-code --out _site/downloads

      - name: Build the other developer workbook and kit downloads
        # downloads/<name>.zip for the Ticket-to-Machine, HR-Driven Identity, Privileged
        # Access and Non-Person Identity workbooks, the Microsoft Automation learning path
        # (each a bundle of its examples folders and pinned Microsoft samples: BUNDLES in
        # build_start_kit_zip.py), the Cisco SD-WAN kit and the Ticket-to-Machine task catalog
        # pack (the catalog kit with the finding contract it reads), the provider notices kit and
        # every kit in one zip (fmw-all-kits.zip), linked from the Downloads page,
        # the workbooks' landing pages and the Watch page.
        run: |
          for kit in ticket-to-machine-code hr-driven-identity-code privileged-access-code non-person-identity-code microsoft-automation-code cisco-sdwan ticket-to-machine-task-catalog dp-consolidation provider-notices-code zta-results global-secure-access-code azure-security-code defender-xdr-code daily-checks-workbook-code platform-host-code information-protection-code sql-server-identity-code msa-request-pack estate-inventory-code all-kits help-desk-automation app-retirement; do
            python3 scripts/build_start_kit_zip.py --kit "$kit" --out _site/downloads
          done

      - name: Build the exports for AI tools
        # llms.txt, a Markdown copy of every page beside its .html, llms-full/<area>.md
        # (each book or section as one file) and downloads/fmw-knowledge-pack.zip,
        # linked from the Downloads page.
        run: python3 scripts/build_ai_exports.py --site _site

      - name: Build the search index
        # Pagefind indexes the finished HTML into _site/pagefind/ (settings in
        # pagefind.yml); assets/site-search.html puts the search box in the navbar.
        run: npx --yes pagefind@1.5.2 --site _site

      - name: Keep the current site for the assemble job
        uses: actions/upload-artifact@v4
        with:
          name: classic-site
          path: _site
          retention-days: 1

  # The New Look preview (newlook/_quarto-newlook.yml, scripts/newlook/render.py):
  # the same pages with a new navigation, rendered beside the current site, in
  # parallel with it, and published under /new-look/. The current site's render
  # above doesn't read anything the New Look adds.
  newlook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install dependencies
        run: bash .github/scripts/install-deps.sh librsvg2-bin python3-yaml

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate command reference and site map
        run: |
          python3 scripts/command_reference.py
          python3 scripts/generate_workbook_map.py

      - name: Render the New Look
        run: python3 scripts/newlook/render.py

      - name: Build the New Look's search index
        # Its own index, with the type, scope, book and audience filters the
        # New Look puts on each page (docs/new-look/search.md uses them).
        run: npx --yes pagefind@1.5.2 --site _site-newlook

      - name: Keep the New Look for the assemble job
        uses: actions/upload-artifact@v4
        with:
          name: newlook-site
          path: _site-newlook
          retention-days: 1

  # Puts the New Look under the current site's /new-look/ and uploads the
  # Pages artifact. A failed New Look build doesn't hold back the current site.
  assemble:
    runs-on: ubuntu-latest
    needs: [build, newlook]
    if: ${{ always() && needs.build.result == 'success' }}
    steps:
      - name: Get the current site
        uses: actions/download-artifact@v4
        with:
          name: classic-site
          path: _site

      - name: Get the New Look
        if: ${{ needs.newlook.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: newlook-site
          path: _site/new-look

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: assemble
    if: ${{ always() && needs.assemble.result == 'success' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

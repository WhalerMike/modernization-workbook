name: Deploy Quarto Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render DOCX to temporary directory
        run: |
          quarto render --to docx --output-dir _docx
          mkdir -p _site

      - name: Render HTML
        run: quarto render --to html

      - name: Copy DOCX files into site
        run: |
          find _docx -name '*.docx' | while read f; do
            rel="${f#_docx/}"
            dest="_site/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done

      - name: Create series ZIPs and combined bundle
        run: |
          mkdir -p _site/downloads

          # SQL Server narrative series ZIP — Markdown + modern images + rendered DOCX
          mkdir -p /tmp/sql-zip
          cp docs/case-studies/sql-server-narrative/*.md /tmp/sql-zip/
          mkdir -p /tmp/sql-zip/images
          cp docs/images/sql-server/*.png docs/images/sql-server/*.jpg /tmp/sql-zip/images/ 2>/dev/null || true
          if [ -d _docx/docs/case-studies/sql-server-narrative ]; then
            cp _docx/docs/case-studies/sql-server-narrative/*.docx /tmp/sql-zip/ 2>/dev/null || true
          fi
          (cd /tmp/sql-zip && zip -r /tmp/sql-server-narrative-series.zip . -x "*bundle*" -x "*highlighted*" -x "*neutralized*")
          cp /tmp/sql-server-narrative-series.zip _site/downloads/

          # Combined series bundle DOCX (concatenate rendered books)
          if command -v pandoc >/dev/null && [ -d _docx/docs/case-studies/sql-server-narrative ]; then
            mkdir -p /tmp/bundle-src
            # Order: series overview, then books 01-11
            for f in series-overview book-01-the-inheritance book-02-the-estate book-03-authentication-audit \
                     book-04-identity-bridge book-05-login-migration book-06-ntlm-elimination book-07-access-control \
                     book-08-upstream-chain book-09-steady-state book-10-certificate-authority book-11-platform-question; do
              src="_docx/docs/case-studies/sql-server-narrative/${f}.docx"
              if [ -f "$src" ]; then
                pandoc "$src" -o "/tmp/bundle-src/${f}.md" 2>/dev/null || true
              fi
            done
            if ls /tmp/bundle-src/*.md >/dev/null 2>&1; then
              cat /tmp/bundle-src/*.md > /tmp/bundle-src/combined.md
              pandoc /tmp/bundle-src/combined.md -o _site/downloads/sql-server-narrative-bundle.docx \
                --reference-doc=assets/reference-mslearn.docx 2>/dev/null || \
              pandoc /tmp/bundle-src/combined.md -o _site/downloads/sql-server-narrative-bundle.docx
            fi
          fi

          # Client-server series
          if [ -d docs/client-server-to-hybrid-cloud ]; then
            (cd docs/client-server-to-hybrid-cloud && zip -r ../../_site/downloads/client-server-to-hybrid-cloud-series.zip *.md 2>/dev/null || true)
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

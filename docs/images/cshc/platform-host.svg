<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="system-ui, sans-serif">
  <rect width="700" height="380" fill="#f8f9fa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">Platform Host — Five Roles</text>
  
  <rect x="200" y="50" width="300" height="50" rx="6" fill="#1a365d"/>
  <text x="350" y="80" text-anchor="middle" font-size="14" fill="white">Single Windows Server Host</text>
  
  <rect x="40" y="130" width="140" height="60" rx="4" fill="#2c5282"/>
  <text x="110" y="155" text-anchor="middle" font-size="11" fill="white">1. Source of Truth</text>
  <text x="110" y="172" text-anchor="middle" font-size="9" fill="#bee3f8">Version control</text>
  
  <rect x="200" y="130" width="140" height="60" rx="4" fill="#2b6cb0"/>
  <text x="270" y="155" text-anchor="middle" font-size="11" fill="white">2. Reverse Proxy</text>
  <text x="270" y="172" text-anchor="middle" font-size="9" fill="#bee3f8">IIS + mTLS</text>
  
  <rect x="360" y="130" width="140" height="60" rx="4" fill="#3182ce"/>
  <text x="430" y="155" text-anchor="middle" font-size="11" fill="white">3. Auth Bridge</text>
  <text x="430" y="172" text-anchor="middle" font-size="9" fill="#bee3f8">Kerberos + PKI</text>
  
  <rect x="520" y="130" width="140" height="60" rx="4" fill="#4299e1"/>
  <text x="590" y="155" text-anchor="middle" font-size="11" fill="white">4. Engine</text>
  <text x="590" y="172" text-anchor="middle" font-size="9" fill="#1a365d">PS + Python</text>
  
  <rect x="200" y="220" width="300" height="50" rx="4" fill="#63b3ed"/>
  <text x="350" y="250" text-anchor="middle" font-size="12" fill="#1a365d">5. Adapter Dispatcher</text>
  
  <text x="350" y="320" text-anchor="middle" font-size="12" fill="#4a5568">Governance and execution never co-mingle.</text>
  <text x="350" y="345" text-anchor="middle" font-size="12" fill="#4a5568">One host. One source of truth. One provenance chain.</text>
</svg>

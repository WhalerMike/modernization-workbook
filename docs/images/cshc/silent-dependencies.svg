  <text x="650" y="160" text-anchor="middle" font-size="11" fill="#22543d">Versioned schemas</text>
  
  <path d="M250 130 L300 130" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500 130 L550 130" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>

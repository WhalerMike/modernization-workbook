<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#f8f9fa"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a365d">Silent Dependencies</text>
  
  <rect x="50" y="80" width="200" height="100" rx="8" fill="#e2e8f0" stroke="#4a5568"/>
  <text x="150" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3748">Active Directory</text>
  <text x="150" y="145" text-anchor="middle" font-size="11" fill="#2d3748">Users and Computers</text>
  <text x="150" y="160" text-anchor="middle" font-size="11" fill="#2d3748">Groups and GPOs</text>
  
  <rect x="300" y="80" width="200" height="100" rx="8" fill="#fed7d7" stroke="#c53030"/>
  <text x="400" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#c53030">Hidden Coupling</text>
  <text x="400" y="145" text-anchor="middle" font-size="11" fill="#742a2a">Undocumented links</text>
  <text x="400" y="160" text-anchor="middle" font-size="11" fill="#742a2a">Implicit dependencies</text>
  
  <rect x="550" y="80" width="200" height="100" rx="8" fill="#c6f6d5" stroke="#276749"/>
  <text x="650" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#276749">Explicit Contracts</text>

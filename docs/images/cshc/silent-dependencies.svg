<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="system-ui, sans-serif">
  <rect width="700" height="300" fill="#f8f9fa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">Silent Dependencies</text>
  
  <rect x="250" y="50" width="200" height="50" rx="6" fill="#1a365d"/>
  <text x="350" y="80" text-anchor="middle" font-size="14" fill="white">Active Directory</text>
  
  <text x="100" y="140" font-size="11" fill="#2d3748">• Users & Computers</text>
  <text x="100" y="160" font-size="11" fill="#2d3748">• Security Groups</text>
  <text x="100" y="180" font-size="11" fill="#2d3748">• Group Policy</text>
  <text x="100" y="200" font-size="11" fill="#2d3748">• Service Accounts</text>
  <text x="100" y="220" font-size="11" fill="#2d3748">• DNS / DHCP</text>
  <text x="100" y="240" font-size="11" fill="#2d3748">• PKI / Certificates</text>
  
  <text x="380" y="140" font-size="11" fill="#2d3748">• RADIUS / 802.1X</text>
  <text x="380" y="160" font-size="11" fill="#2d3748">• LDAP</text>
  <text x="380" y="180" font-size="11" fill="#2d3748">• Service Principal Names</text>
  <text x="380" y="200" font-size="11" fill="#2d3748">• Trust Relationships</text>
  <text x="380" y="220" font-size="11" fill="#2d3748">• Delegation Boundaries</text>
  
  <text x="350" y="280" text-anchor="middle" font-size="12" fill="#c53030">When AD is removed, these fail silently.</text>
</svg>

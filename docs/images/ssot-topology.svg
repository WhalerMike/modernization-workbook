<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="system-ui, sans-serif">
  <rect width="700" height="400" fill="#f8f9fa"/>
  <text x="350" y="35" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a2e">Single Source of Truth</text>
  
  <!-- Authoritative -->
  <rect x="250" y="60" width="200" height="60" rx="6" fill="#1a365d"/>
  <text x="350" y="97" text-anchor="middle" font-size="14" fill="white" font-weight="500">Authoritative Origin</text>
  
  <!-- Arrows and derived -->
  <line x1="350" y1="120" x2="150" y2="180" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="120" x2="350" y2="180" stroke="#4a5568" stroke-width="2"/>
  <line x1="350" y1="120" x2="550" y2="180" stroke="#4a5568" stroke-width="2"/>
  
  <rect x="50" y="190" width="160" height="50" rx="4" fill="#e2e8f0" stroke="#cbd5e0"/>
  <text x="130" y="220" text-anchor="middle" font-size="12" fill="#2d3748">Derived Copy A</text>
  
  <rect x="270" y="190" width="160" height="50" rx="4" fill="#e2e8f0" stroke="#cbd5e0"/>
  <text x="350" y="220" text-anchor="middle" font-size="12" fill="#2d3748">Derived Copy B</text>
  
  <rect x="490" y="190" width="160" height="50" rx="4" fill="#e2e8f0" stroke="#cbd5e0"/>
  <text x="570" y="220" text-anchor="middle" font-size="12" fill="#2d3748">Derived Copy C</text>
  
  <text x="350" y="290" text-anchor="middle" font-size="13" fill="#4a5568">All derived representations are provenance-anchored pointers.</text>
  <text x="350" y="315" text-anchor="middle" font-size="13" fill="#4a5568">Drift is measured against the authoritative origin.</text>
  
  <rect x="150" y="340" width="400" height="40" rx="4" fill="#fed7d7" stroke="#fc8181"/>
  <text x="350" y="365" text-anchor="middle" font-size="12" fill="#c53030">Contention: writing to a demoted instance after roster ratification</text>
</svg>

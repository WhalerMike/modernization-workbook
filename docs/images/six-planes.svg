<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="system-ui, sans-serif">
  <rect width="600" height="420" fill="#f8f9fa"/>
  <text x="300" y="35" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a2e">Six-Plane Architecture</text>
  
  <rect x="150" y="55" width="300" height="45" rx="4" fill="#1a365d"/>
  <text x="300" y="83" text-anchor="middle" font-size="13" fill="white">Identity</text>
  
  <rect x="150" y="110" width="300" height="45" rx="4" fill="#2c5282"/>
  <text x="300" y="138" text-anchor="middle" font-size="13" fill="white">Structure</text>
  
  <rect x="150" y="165" width="300" height="45" rx="4" fill="#2b6cb0"/>
  <text x="300" y="193" text-anchor="middle" font-size="13" fill="white">Policy</text>
  
  <rect x="150" y="220" width="300" height="45" rx="4" fill="#3182ce"/>
  <text x="300" y="248" text-anchor="middle" font-size="13" fill="white">Governance</text>
  
  <rect x="150" y="275" width="300" height="45" rx="4" fill="#4299e1"/>
  <text x="300" y="303" text-anchor="middle" font-size="13" fill="white">Network / Addressing</text>
  
  <rect x="150" y="330" width="300" height="45" rx="4" fill="#63b3ed"/>
  <text x="300" y="358" text-anchor="middle" font-size="13" fill="#1a365d">Compute / Access</text>
  
  <text x="300" y="400" text-anchor="middle" font-size="12" fill="#4a5568">Each plane has an authoritative origin. Drift is evaluated per plane.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#f8f9fa"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a365d">Drift Detection Loop</text>
  
  <!-- Loop stages -->
  <rect x="50" y="80" width="120" height="60" rx="8" fill="#3182ce"/>
  <text x="110" y="115" text-anchor="middle" font-size="12" fill="white">Observe</text>
  
  <rect x="220" y="80" width="120" height="60" rx="8" fill="#38a169"/>
  <text x="280" y="115" text-anchor="middle" font-size="12" fill="white">Compare</text>
  
  <rect x="390" y="80" width="120" height="60" rx="8" fill="#dd6b20"/>
  <text x="450" y="115" text-anchor="middle" font-size="12" fill="white">Detect</text>
  
  <rect x="560" y="80" width="120" height="60" rx="8" fill="#e53e3e"/>
  <text x="620" y="115" text-anchor="middle" font-size="12" fill="white">Alert</text>
  
  <rect x="390" y="220" width="120" height="60" rx="8" fill="#805ad5"/>
  <text x="450" y="255" text-anchor="middle" font-size="12" fill="white">Remediate</text>
  
  <!-- Arrows -->
  <path d="M170 110 L220 110" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M340 110 L390 110" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M510 110 L560 110" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M620 140 L620 190 L450 190 L450 220" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M390 250 L110 250 L110 140" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>
</svg>

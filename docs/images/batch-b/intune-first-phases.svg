<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" font-family="system-ui, sans-serif">
  <rect width="700" height="160" fill="#ffffff"/>
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a2e">Intune-First Onboarding</text>
  <rect x="20" y="45" width="120" height="50" rx="4" fill="#1a365d"/>
  <text x="80" y="75" text-anchor="middle" font-size="11" fill="white">1 Procure</text>
  <rect x="155" y="45" width="120" height="50" rx="4" fill="#2c5282"/>
  <text x="215" y="75" text-anchor="middle" font-size="11" fill="white">2 Carrier</text>
  <rect x="290" y="45" width="120" height="50" rx="4" fill="#2b6cb0"/>
  <text x="350" y="75" text-anchor="middle" font-size="11" fill="white">3 Validate</text>
  <rect x="425" y="45" width="120" height="50" rx="4" fill="#3182ce"/>
  <text x="485" y="75" text-anchor="middle" font-size="11" fill="white">4 Enroll</text>
  <rect x="560" y="45" width="120" height="50" rx="4" fill="#4299e1"/>
  <text x="620" y="75" text-anchor="middle" font-size="11" fill="#1a365d">5 Verify</text>
  <text x="350" y="130" text-anchor="middle" font-size="12" fill="#4a5568">Procurement-first attribute assignment. No empty governance attribute.</text>
</svg>

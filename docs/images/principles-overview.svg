<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, sans-serif">
  <rect width="800" height="500" fill="#f8f9fa"/>
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="600" fill="#1a1a2e">Modernization Principles</text>
  
  <!-- Foundation -->
  <rect x="50" y="70" width="700" height="70" rx="8" fill="#1a365d"/>
  <text x="400" y="112" text-anchor="middle" font-size="16" fill="white" font-weight="500">Foundation: Single Source of Truth · Provenance · Drift is Explicit</text>
  
  <!-- Structure -->
  <rect x="50" y="160" width="700" height="70" rx="8" fill="#2c5282"/>
  <text x="400" y="202" text-anchor="middle" font-size="16" fill="white" font-weight="500">Structure: Attribute-Driven · Dynamic Membership · Identity as Root</text>
  
  <!-- Migration -->
  <rect x="50" y="250" width="700" height="70" rx="8" fill="#2b6cb0"/>
  <text x="400" y="292" text-anchor="middle" font-size="16" fill="white" font-weight="500">Migration: No Rip-and-Replace · Bridging · Regenerate Not Copy</text>
  
  <!-- Zero Trust -->
  <rect x="50" y="340" width="700" height="70" rx="8" fill="#3182ce"/>
  <text x="400" y="382" text-anchor="middle" font-size="16" fill="white" font-weight="500">Zero Trust & Journey: Token-Based · Continuous Evidence · Fewer Round-Trips</text>
  
  <text x="400" y="470" text-anchor="middle" font-size="13" fill="#4a5568">Every claim has one authoritative origin. All else is a provenance-anchored pointer.</text>
</svg>

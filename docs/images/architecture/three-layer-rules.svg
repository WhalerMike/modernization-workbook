<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="system-ui, sans-serif">
  <rect width="600" height="320" fill="#f8f9fa"/>
  <text x="300" y="35" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a2e">Three-Layer Rule Model</text>
  
  <rect x="100" y="60" width="400" height="60" rx="6" fill="#1a365d"/>
  <text x="300" y="85" text-anchor="middle" font-size="14" fill="white" font-weight="500">Intent</text>
  <text x="300" y="105" text-anchor="middle" font-size="11" fill="#bee3f8">What should be true — authoritative source</text>
  
  <rect x="100" y="140" width="400" height="60" rx="6" fill="#2c5282"/>
  <text x="300" y="165" text-anchor="middle" font-size="14" fill="white" font-weight="500">Realization</text>
  <text x="300" y="185" text-anchor="middle" font-size="11" fill="#bee3f8">What was deployed — configuration and policy</text>
  
  <rect x="100" y="220" width="400" height="60" rx="6" fill="#2b6cb0"/>
  <text x="300" y="245" text-anchor="middle" font-size="14" fill="white" font-weight="500">Observation</text>
  <text x="300" y="265" text-anchor="middle" font-size="11" fill="#bee3f8">What is actually happening — telemetry and evidence</text>
  
  <text x="300" y="305" text-anchor="middle" font-size="12" fill="#4a5568">Drift = difference between layers. Closure requires all three to agree.</text>
</svg>

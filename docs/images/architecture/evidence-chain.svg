<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="system-ui, sans-serif">
  <rect width="700" height="280" fill="#f8f9fa"/>
  <text x="350" y="35" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a2e">Evidence Chain</text>
  
  <rect x="40" y="70" width="140" height="70" rx="6" fill="#1a365d"/>
  <text x="110" y="100" text-anchor="middle" font-size="12" fill="white">Authoritative</text>
  <text x="110" y="118" text-anchor="middle" font-size="12" fill="white">Origin</text>
  
  <polygon points="180,105 200,105 200,95 220,105 200,115 200,105" fill="#4a5568"/>
  
  <rect x="220" y="70" width="140" height="70" rx="6" fill="#2c5282"/>
  <text x="290" y="100" text-anchor="middle" font-size="12" fill="white">Change</text>
  <text x="290" y="118" text-anchor="middle" font-size="12" fill="white">Execution</text>
  
  <polygon points="360,105 380,105 380,95 400,105 380,115 380,105" fill="#4a5568"/>
  
  <rect x="400" y="70" width="140" height="70" rx="6" fill="#2b6cb0"/>
  <text x="470" y="100" text-anchor="middle" font-size="12" fill="white">Provenance</text>
  <text x="470" y="118" text-anchor="middle" font-size="12" fill="white">Record</text>
  
  <polygon points="540,105 560,105 560,95 580,105 560,115 560,105" fill="#4a5568"/>
  
  <rect x="40" y="170" width="620" height="70" rx="6" fill="#2d3748"/>
  <text x="350" y="200" text-anchor="middle" font-size="14" fill="white" font-weight="500">Continuous Monitoring Stream</text>
  <text x="350" y="220" text-anchor="middle" font-size="12" fill="#a0aec0">Evidence is a byproduct of the change path, not assembled later.</text>
</svg>

# Book 01, Chapter 2 — why Conditional Access has no leverage over Kerberos or
# NTLM, and full leverage over an Entra token.
rankdir: LR
graph: {nodesep: 0.3, ranksep: 0.45}
clusters:
  - id: new
    label: "Entra token: the policy decides before the credential exists"
    tone: blue
    nodes: [n1, n2, n3, n4]
  - id: old
    label: "Kerberos or NTLM: no token request, so no policy decision"
    tone: slate
    nodes: [o1, o2, o3]
nodes:
  o1: {tone: plain, width: 150, title: "DBA workstation", body: ["=Unmanaged, off-network or risky — it doesn't matter"], size: 12}
  o2: {tone: slate, width: 170, title: "Domain controller", body: ["=Ticket or NTLM"], size: 12}
  o3: {tone: slate, width: 160, title: "SQL Server", body: ["=Session opens"], size: 12}
  n1: {tone: plain, width: 150, title: "DBA workstation", body: ["=Requests a token for SQL Server"], size: 12}
  n2: {tone: blue, width: 175, title: "Conditional Access", body: ["MFA completed?", "Device compliant?", "Named location?", "Sign-in risk?"], size: 12}
  n3: {tone: green, width: 160, title: "Token issued", body: ["=SQL Server accepts it"], size: 12}
  n4: {tone: red, width: 160, title: "Token denied", body: ["=Connection never opens"], size: 12}
edges:
  - [o1, o2]
  - [o2, o3]
  - [n1, n2, {tone: blue}]
  - [n2, n3, {tone: green, label: "all pass"}]
  - [n2, n4, {tone: red, label: "any fail"}]

# Book 03, Chapter 1 — the login types the audit classifies (values of
# sys.server_principals.type) and what happens to each.
rankdir: TB
nodes:
  t:
    kind: table
    tone: slate
    columns: ["Type", "What it is", "Authenticates against", "Disposition"]
    widths: [70, 230, 190, 200]
    rows:
      - [{text: "U", tone: slate}, "Windows login for an AD user (`DOMAIN\\user`)", "Active Directory (Kerberos or NTLM)", {text: "Migrate to an Entra user login (E), then disable and drop", tone: amber}]
      - [{text: "G", tone: slate}, "Windows login for an AD group", "Active Directory group SIDs in the ticket", {text: "Migrate to an Entra group login (X)", tone: amber}]
      - [{text: "S", tone: red}, "SQL login, password stored in master (includes sa)", "The instance itself — invisible to Entra ID", {text: "Critical finding: migrate to a service principal or managed identity, or except; disable and rename sa", tone: red}]
      - [{text: "C", tone: slate}, "Login mapped to a certificate", "A certificate in master", {text: "Inventory with the issuing CA (Book 10)", tone: amber}]
      - [{text: "K", tone: slate}, "Login mapped to an asymmetric key", "A key in master", {text: "Inventory; usually internal signing", tone: plain}]
      - [{text: "E", tone: blue}, "Entra user or application (`FROM EXTERNAL PROVIDER`)", "Microsoft Entra access token", {text: "Target state", tone: green}]
      - [{text: "X", tone: blue}, "Entra group (`FROM EXTERNAL PROVIDER`)", "Group membership from Entra ID", {text: "Target state", tone: green}]

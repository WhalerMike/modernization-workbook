# Book 10, Chapter 1 — what fails if ADCS goes away before each dependency is
# moved, and the migration path for each.
rankdir: TB
nodes:
  t:
    kind: table
    tone: slate
    columns: ["Dependency", "If ADCS goes first", "Migration path"]
    widths: [175, 255, 265]
    rows:
      - [{text: "TLS server certificate", tone: slate}, {text: "It expires with no CA to renew it; clients that validate the certificate refuse to connect", tone: red}, "Issue from the replacement CA and bind it before the old one expires or ADCS goes offline, whichever comes first"]
      - [{text: "Certificate-mapped login (type C)", tone: slate}, {text: "Signed modules and endpoints break if an ADCS-issued certificate can't be replaced (type-C logins can't be used to connect)", tone: red}, "Check the issuer; replace ADCS-issued certificates, re-sign modules, reconfigure endpoints"]
      - [{text: "Certificate-based authentication (interim)", tone: amber}, {text: "No CA to issue the certificates the NTLM exception long-tail depends on", tone: red}, "Replacement CA live and issuing before ADCS is retired"]

# Book 08, Chapter 2 — the order in which DefaultAzureCredential (Azure.Identity
# for .NET) tries credentials, and what to use in production.
rankdir: TB
graph: {nodesep: 0.25, ranksep: 0.35}
clusters:
  - id: chain
    label: "DefaultAzureCredential: the first credential that returns a token wins"
    tone: slate
    nodes: [c1, c2, c3, c4]
    order: [c1, c2, c3, c4]
nodes:
  c1: {tone: slate, width: 150, tag: "1", title: "Environment", body: ["=Service principal from environment variables"], size: 12}
  c2: {tone: slate, width: 150, tag: "2", title: "Workload identity", body: ["=Kubernetes workloads"], size: 12}
  c3: {tone: green, width: 150, tag: "3", title: "Managed identity", body: ["=Arc agent, Azure VM or Azure-hosted service"], size: 12}
  c4: {tone: slate, width: 150, tag: "4 and later", title: "Developer tools", body: ["=Visual Studio, VS Code, Azure CLI, Azure PowerShell, azd, broker"], size: 12}
  prod: {tone: green, width: 640, title: "In production, be explicit", body: ["=Use `Authentication=Active Directory Managed Identity` (or `ManagedIdentityCredential` in code). `Active Directory Default` runs the whole chain: convenient on a developer machine, but slower and sensitive to host environment variables in production."], size: 12}
edges:
  - [c1, c2]
  - [c2, c3]
  - [c3, c4]
  - [c2, prod, {style: invis}]

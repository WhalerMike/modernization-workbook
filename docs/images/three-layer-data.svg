<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="system-ui, sans-serif">
  <rect width="600" height="350" fill="#f8f9fa"/>
  <text x="300" y="35" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a2e">Where Data Lives</text>
  
  <rect x="100" y="60" width="400" height="60" rx="6" fill="#1a365d"/>

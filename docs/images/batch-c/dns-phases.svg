<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" font-family="system-ui, sans-serif">
  <rect width="700" height="180" fill="#ffffff"/>
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a2e">DNS Modernization Sequence</text>
  <rect x="20" y="45" width="100" height="40" rx="4" fill="#742a2a"/>
  <text x="70" y="70" text-anchor="middle" font-size="10" fill="white">Assess</text>
  <rect x="130" y="45" width="100" height="40" rx="4" fill="#744210"/>
  <text x="180" y="70" text-anchor="middle" font-size="10" fill="white">Resolver</text>
  <rect x="240" y="45" width="100" height="40" rx="4" fill="#2c5282"/>
  <text x="290" y="70" text-anchor="middle" font-size="10" fill="white">Zones</text>
  <rect x="350" y="45" width="100" height="40" rx="4" fill="#2b6cb0"/>
  <text x="400" y="70" text-anchor="middle" font-size="10" fill="white">Forwarding</text>
  <rect x="460" y="45" width="100" height="40" rx="4" fill="#3182ce"/>
  <text x="510" y="70" text-anchor="middle" font-size="10" fill="white">Validate</text>
  <rect x="570" y="45" width="100" height="40" rx="4" fill="#1a365d"/>
  <text x="620" y="70" text-anchor="middle" font-size="10" fill="white">Decommission</text>
  <text x="350" y="120" text-anchor="middle" font-size="12" fill="#4a5568">Split-brain and private-endpoint consistency are the primary risks.</text>
</svg>

# Chapter 07 — the canonical leaver sequence. Devices first, because deleting
# the user doesn't revoke Intune SCEP certificates; disable before revoking
# sessions, per Microsoft's emergency-revocation order.
rankdir: TB
graph: {nodesep: 0.3, ranksep: 0.32}
nodes:
  hr: {kind: card, tone: plain, width: 440, title: "HR separation record", body: ["=Effective-dated; sets `employeeLeaveDateTime` through provisioning"], size: 12}
  s1: {tone: slate, width: 440, tag: "Step 1 · Intune", title: "Retire or wipe every managed device", body: ["=Revokes and removes Intune SCEP and PKCS certificates"], size: 12}
  s2: {tone: slate, width: 440, tag: "Step 2 · Card management system", title: "Revoke the PIV credential", body: ["=PIV authentication and card authentication certificates, plus any derived PIV credentials"], size: 12}
  s3: {tone: blue, width: 440, tag: "Step 3 · Entra ID and AD", title: "Disable the account", body: ["=No new sign-ins or tokens"], size: 12}
  s4: {tone: blue, width: 440, tag: "Step 4 · Entra ID", title: "Revoke sessions and refresh tokens", body: ["=Ends issued tokens now, without waiting for the next CRL"], size: 12}
  s5: {tone: green, width: 440, tag: "Step 5 · After the retention period", title: "Delete the user", body: ["=Post-offboarding workflow"], size: 12}
  warn: {tone: red, width: 220, title: "Why devices come first", body: ["=Deleting the user or removing the license leaves SCEP certificates valid on the device"], size: 12}
edges:
  - [hr, s1]
  - [s1, s2]
  - [s2, s3]
  - [s3, s4]
  - [s4, s5]
  - [warn, s1, {style: dashed, tone: red, attrs: "constraint=false"}]

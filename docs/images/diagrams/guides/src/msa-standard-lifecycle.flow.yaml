# Service Account Migration guide, "The managed service account standard",
# steps S1 to S11 and who runs each ("Who does what", "The steps"). Blue: a
# machine or script runs the step; amber: a person decides or acts. Program
# design (WD-159 to WD-170); gMSA facts as documented on Microsoft Learn
# (service-accounts-group-managed), read Nov 22, 2026.

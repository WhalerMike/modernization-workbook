  s3: {tone: amber, width: 175, tag: "S3 Approve", title: "Approvers in SailPoint", body: ["=ServiceNow records the change and never approves"], size: 12}
  s4: {tone: blue, width: 175, tag: "S4 Create", title: "The pipeline", body: ["=`gmsa-msapipe` runs the approved plan: gMSA, AES256, 30 days, retriever group"], size: 12}

  s7: {tone: blue, width: 175, tag: "S7 Watch", title: "Scheduled runs", body: ["=Defender for Identity, VK-NPI-06, Chapter 06; an unrequested gMSA is drift"], size: 12}
  s8: {tone: amber, width: 175, tag: "S8 Attest", title: "The two owners", body: ["=SailPoint certification by risk tier; a revoke opens a task"], size: 12}
  s9: {tone: blue, width: 175, tag: "S9 Owner change, orphans", title: "HR-driven workflow", body: ["=Transfer on the owner's HR event; an orphan is disabled, then 30 days to claim"], size: 12}
  s10: {tone: amber, width: 175, tag: "S10 Retire", title: "Pipeline, then a person", body: ["=Disable and move; after 90 days a person uninstalls and deletes; a dMSA's old account is never deleted"], size: 12}
  s11: {tone: blue, width: 175, tag: "S11 Move to Entra", title: "Chapter 05", body: ["=Migration C, when the workload moves"], size: 12}

# Non-Person Identity training, Module 4 (also Microsoft automation
# foundations, Unit 3) — the credential order for a workload identity, the
# non-agent version of Book 17's ch06-credential-order. Order: a managed
# identity where the workload runs on Azure or an Azure Arc-enabled server;
# workload identity federation where its platform issues tokens Entra ID can
# trust; otherwise a certificate, its key in Key Vault or an HSM, new ones
# capped at 180 days by the app management policy, rotated through the vault
# and uploaded to the app registration. New client secrets are blocked by the
# app management policy; a secret exists only by documented exception
# (NPI guide, Step 2 and Step 3, steps 1, 4, 5 and 6). The order and the
# exception rule are program design. Microsoft Learn, read Nov 22, 2026:
# "Configure restrictions on how applications can be configured"
# (passwordAddition, symmetricKeyAddition, asymmetricKeyLifetime) and
# "Securing managed identities in Microsoft Entra ID" (credentials managed and
# rotated by Azure; no one has access to them).
rankdir: TB
graph: {nodesep: 0.35, ranksep: 0.3}
nodes:
  azure: {tone: amber, width: 300, title: "Does the workload run on Azure or an Arc-enabled server?", size: 12}
  mi: {tone: green, width: 250, tag: "First choice", title: "Managed identity", body: ["=Azure manages and rotates the credential; nobody can read it"], size: 12}
  issuer: {tone: amber, width: 300, title: "Does its platform issue tokens Entra ID can trust?", size: 12}
  wif: {tone: green, width: 250, tag: "Second choice", title: "Workload identity federation", body: ["=No stored secret; issuer and subject recorded and approved"], size: 12}
  cert: {tone: amber, width: 300, tag: "Third choice", title: "Certificate", body: ["Key in Key Vault or an HSM", "New ones capped at 180 days by policy", "Rotated, then uploaded to the app"], size: 12}
  secret: {tone: red, width: 300, title: "Client secret", body: ["=New secrets blocked by the app management policy; documented exception only"], size: 12}
edges:
  - [azure, mi, {label: "yes", tone: green}]
  - [azure, issuer, {label: "no"}]
  - [issuer, wif, {label: "yes", tone: green}]
  - [issuer, cert, {label: "no", tone: amber}]
  - [cert, secret, {label: "exception only", style: dashed, tone: red}]
ranks:
  - [azure, mi]
  - [issuer, wif]

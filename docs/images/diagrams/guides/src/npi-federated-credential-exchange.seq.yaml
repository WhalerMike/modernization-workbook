# Non-Person Identity training, Module 7 (Units 2-3) — a federated credential
# in use: the workload's own issuer gives it a token; Microsoft Entra ID
# checks the token's issuer, subject and audience against the federated
# credential, exactly and case for case, and validates it against the
# issuer's OIDC endpoint; the access token reaches the resource. Before the
# credential is created, the program checks it against what the workload will
# present and tests the exchange against a fake; after cutover, old and new
# run side by side for 30 days before the legacy account is disabled.
# Follows the NPI developer workbook Chapter 05 (What the code depends on,
# The checks, The plan, The separate write path) and the NPI implementation
# guide's Step 5. Exchange steps and matching rules as documented on Microsoft
# Learn (workload-identity-federation, workload-identity-federation-
# considerations), read Nov 22, 2026. The pre-checks, the 30-day run and
# disable-not-delete are program design.
column: 165
gap: 20
participants:
  - {id: wl, label: "Workload", sub: "GitHub Actions job, Kubernetes pod, other OIDC host", tone: slate}
  - {id: idp, label: "External issuer", sub: "the platform's own identity provider", tone: slate}
  - {id: entra, label: "Microsoft Entra ID", sub: "app registration or user-assigned managed identity", tone: blue}
  - {id: res, label: "Protected resource", sub: "Microsoft Graph, Azure, other Entra-protected API", tone: green}
steps:
  - note: "Before the credential is created (program): its issuer, subject and audience are compared with what the workload will present, and the exchange is tested against a fake. Then it is created, one write at a time."
    tone: violet
  - {from: wl, to: idp, n: 1, label: "Request a token"}
  - {from: idp, to: wl, n: 2, dashed: true, label: "Token: iss, sub, aud"}
  - {from: wl, to: entra, n: 3, label: "Client credentials request, the token as the assertion"}
  - note: "4. Entra ID matches the token to the federated credential: issuer = iss, subject = sub, audience = api://AzureADTokenExchange, exactly and case for case. It validates the token against the issuer's OIDC URL."
    over: [entra, res]
    tone: blue
  - {from: entra, to: wl, n: 5, dashed: true, tone: blue, label: "Access token"}
  - {from: wl, to: res, n: 6, tone: green, label: "Call with the access token"}
  - note: "A wrong subject is accepted at creation without error; only the exchange fails. A new credential may fail with AADSTS70021 for a few minutes while it propagates."
    tone: red
  - frame: "Parallel run, 30 days (program)"
    tone: amber
    steps:
      - note: "The legacy account or secret stays enabled. Watch the new identity's sign-ins in Entra ID and the legacy account's logons on the domain controllers."
        tone: amber
      - note: "After a clean 30 days and the owner's approval: disable the legacy account, never delete it. A secret is removed only after the new credential has carried production traffic."
        tone: green

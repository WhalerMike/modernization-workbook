# Service Accounts guide (service-account-migration.md): the whole journey.
# A user account used as a service is inventoried and run through the
# decision path (questions 1 to 8, first yes wins; a hybrid workload at
# question 4 takes two; question 9 puts Kerberos targets on the island
# list), then takes one lane: Retire, Migration C (Entra workload
# identity), the time-limited Keep / KeepKerberos exception, Migration B
# (dMSA, Windows Server 2025) or Migration A (gMSA, also for an sMSA). A gMSA or dMSA moves on to Entra by S11 /
# Migration C when the workload moves. The band is the managed service
# account standard. Every label is the guide's own wording, condensed.
rankdir: LR
graph: {nodesep: 0.2, ranksep: 0.3}
clusters:
  - id: standard
    label: "The managed service account standard: machines run the steps; people decide"
    tone: violet
    nodes: [s1, s2, s3, s4]
nodes:
  start: {tone: red, width: 124, tag: "Start", title: "A user account used as a service", body: ["Password set and rotated by hand", "SPNs: high Kerberoasting exposure"], size: 12}
  decide: {tone: violet, width: 150, tag: "A1, S2", title: "Inventory, then the decision path", body: ["Questions 1 to 8, in order", "The first yes is the target", "Q4 hybrid: Entra and Kerberos, two dispositions", "Two owners and a sponsor", "Disposition recorded (Chapter 03)"], size: 12}
  retire: {tone: slate, width: 218, tag: "Q1 · Retire", title: "Retire", body: ["Disabled, unused or no owner", "The decommission process"], size: 12}
  lanec: {tone: blue, width: 218, tag: "Q2–Q4 · Replatform · Migration C", title: "Microsoft Entra workload identity", body: ["C1 Azure: user-assigned managed identity", "C2 Arc-enabled server: its own identity", "C3 No Arc agent: app registration, certificate", "C4 CI/CD, other clouds: federation", "C5 Retire the on-premises account"], foot: "Never a client secret. Q4 hybrid: also Q5–Q8 for Kerberos", size: 12}
  lanea: {tone: green, width: 218, tag: "Q8 · Replatform · Migration A", title: "gMSA", body: ["A1 Inventory the account, SPNs, hosts", "A2 KDS root key at least 10 hours old", "A3 Create the gMSA", "A4 Install and test on each host", "A5 Switch the workload, move SPNs", "A6 Verify; 30-day parallel run", "A7 Disable; delete after 90 days"], foot: "An sMSA is replaced by a gMSA the same way", size: 12}
  laneb: {tone: green, width: 218, tag: "Q7 · Replatform · Migration B", title: "dMSA (Windows Server 2025)", body: ["=A 2025 domain controller, every host on 2025", "B0 Old account has AES keys", "B1 Create the dMSA", "B2 Start the migration", "B3 Wait 30 days (Learn: at least 14, 28 recommended), then complete"], foot: "Original account stays disabled, never deleted", size: 12}
  keep: {tone: amber, width: 218, tag: "Q5–Q6 · Keep · KeepKerberos", title: "Time-limited exception", body: ["Q5 Already a gMSA or dMSA: Keep", "Q6 No managed account, or unconstrained delegation: KeepKerberos, authorizing official accepts", "SPN owner; end date recorded by D08, never after G5 or the island's end of life"], size: 12}
  entra: {tone: blue, width: 122, tag: "End state", title: "Microsoft Entra workload identity", body: ["OAuth to Entra-protected resources"], size: 12}
  island: {tone: slate, width: 122, tag: "Q9 · Kerberos island", title: "Stays in AD while Kerberos is needed", body: ["Dated island list", "Until the resource is retired or replatformed"], size: 12}
  s1: {kind: pill, tone: violet, size: 12, width: 120, text: "S1 Request in the access management tool"}
  s2: {kind: pill, tone: violet, size: 12, width: 136, text: "S3 SailPoint approves; ServiceNow records the change, never approves"}
  s3: {kind: pill, tone: violet, size: 12, width: 200, text: "S4 The pipeline creates the gMSA; people run dMSA steps and deletes"}
  s4: {kind: pill, tone: violet, size: 12, width: 118, text: "S5–S10 Install, watch, attest, retire; evidence kept"}
edges:
  - [start, decide, {tone: red}]
  - [decide, retire, {tone: slate}]
  - [decide, lanec, {tone: blue}]
  - [decide, lanea, {tone: green}]
  - [decide, laneb, {tone: green}]
  - [decide, keep, {tone: amber}]
  - [lanec, entra, {tone: blue}]
  - [lanea, island, {tone: green}]
  - [laneb, island, {tone: green}]
  - [keep, island, {tone: amber}]
  - [entra, island, {tone: blue, style: dashed, attrs: "dir=back", label: "S11, Migration C: when the workload moves", lw: 78, xlabel: true}]
  - [s1, s2, {tone: violet}]
  - [s2, s3, {tone: violet}]
  - [s3, s4, {tone: violet}]
order:
  - [start, s1]
  - [decide, s2]
  - [retire, lanec, keep, laneb, lanea, s3]
  - [entra, island, s4]

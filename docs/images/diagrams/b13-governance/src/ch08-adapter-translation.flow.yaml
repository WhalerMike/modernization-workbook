# Book 13 Chapter 08 — adapters as translators. Each platform keeps its own
# state and interface; its adapter reads it, translates it into the common
# record and wraps it in provenance. Rules, the drift engine and the evidence
# chain read only the record. Change-making adapters act on authorized plans
# only. Program design; platforms are generic examples.

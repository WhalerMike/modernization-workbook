  c2: {tone: slate, width: 210, title: "Devices and files move", body: ["PCs enrolled in Intune", "Mapped drives retire"], size: 11}
  c3: {tone: red, width: 210, title: "Attackers follow the change", body: ["Fake prompts and reset notices", "Fake IT calls"], size: 11}
  m1: {tone: blue, width: 250, tag: "Modules 1 and 2", title: "Sign in; reset and recover", body: ["PIV, Windows Hello for Business or a passkey", "Two methods registered", "What recovery requires"], size: 11}
  m2: {tone: blue, width: 250, tag: "Modules 3 and 4", title: "Enroll; find and share files", body: ["Read and fix compliance status", "What the agency can see", "Leave the old drives alone"], size: 11}
  m3: {tone: blue, width: 250, tag: "Modules 5 and 6", title: "Report; know the help desk rules", body: ["Messages, prompts and notices", "What the help desk will and won't ask"], size: 11}
  rec: {tone: violet, width: 190, title: "Training record", body: ["=Per person and module, before the wave's cutover"], size: 11}

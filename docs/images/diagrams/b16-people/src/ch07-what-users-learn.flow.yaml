# Book 16 Chapter 07 — what end users must learn, and the change in the estate
# that makes each lesson necessary. Left: three changes (slate, red for the
# attacker). Middle: the six learning modules in three pairs (blue). Right: one
# training record per person and module before the wave's cutover (violet).
# The module list is program design; the requirement to train on significant
# system change is 5 CFR 930.301(d) and AT-2, cited in the chapter.
rankdir: LR
graph: {nodesep: 0.25, ranksep: 0.5}
nodes:

# Book 16 Chapter 02 — the federal workforce requirements in layers. Statutes
# (FISMA, 44 U.S.C. 3554; the Federal Cybersecurity Workforce Assessment Act,
# Pub. L. 114-113 div. N title III) set the duties; OMB Circular A-130 and OPM
# (5 CFR 930.301 and the cybersecurity data standard codes) turn them into policy
# and rules; NIST supplies the vocabulary (SP 800-181 Rev. 1 and the NICE
# Framework Components v2.2.0) and the learning-program guidance (SP 800-50
# Rev. 1). The agency's roster, coded positions and curriculum are where they
# meet. Sources in the chapter footnotes.

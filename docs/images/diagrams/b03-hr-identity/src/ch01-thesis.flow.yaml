# Chapter 01 — the thesis: two migrations happen anyway. HR moves to Core HCM and
# identity moves from AD toward Entra ID. Together they are the opportunity to start
# HR-driven identity, with OPM standard attributes as the contract.
rankdir: LR
graph: {nodesep: 0.3, ranksep: 0.3}
nodes:

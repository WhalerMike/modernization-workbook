  ent: {tone: slate, width: 116, tag: "Migration 2", title: "Identity moves to Entra ID", body: ["=Users' object source of authority (object SOA) moves from AD to the cloud"], size: 12}
  std: {tone: amber, width: 116, tag: "The contract", title: "OPM standard attributes", body: ["=Data standards and personnel actions"], size: 12}
  model: {tone: blue, width: 116, tag: "Start of authority", title: "HR-driven identity", body: ["=Governed model, provenance per event"], size: 12}
  dirs: {tone: blue, width: 108, title: "Entra ID and AD", body: ["=Accounts created, changed and disabled by HR events"], size: 12}
  icam: {tone: green, width: 116, title: "ICAM", body: ["=Credentials, devices, access, assurance and evidence"], size: 12}
edges:

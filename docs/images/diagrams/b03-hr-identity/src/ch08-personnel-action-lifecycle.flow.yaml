  j: {tone: green, width: 260, tag: "1xx accessions", title: "Joiner", body: ["=Account before day one; baseline access derived"], size: 12}
  c: {tone: blue, width: 260, tag: "5xx conversions", title: "Conversion", body: ["=Same person and key; access re-derived"], size: 12}
  m: {tone: blue, width: 260, tag: "7xx position, duty station, name changes", title: "Mover", body: ["=Re-stamp attributes; review residual access"], size: 12}
  n: {tone: amber, width: 260, tag: "4xx nonpay or nonduty status", title: "Not a leaver", body: ["=Person kept; account restricted by policy"], size: 12}
  r: {tone: green, width: 260, tag: "2xx return to duty", title: "Reinstate", body: ["=Restrictions lifted"], size: 12}
  l: {tone: red, width: 260, tag: "3xx separations", title: "Leaver", body: ["=Block first, then revoke and reconcile"], size: 12}

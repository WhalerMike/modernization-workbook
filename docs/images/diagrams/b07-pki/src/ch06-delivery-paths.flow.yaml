  s1: {tone: blue, width: 230, tag: "SCEP · Cloud PKI", title: "Device makes the key and request", body: ["=Private key never leaves the device"], size: 12}
  s2: {tone: slate, width: 230, tag: "SCEP · AD CS", title: "Device makes the key and request", body: ["=Private key never leaves the device"], size: 12}

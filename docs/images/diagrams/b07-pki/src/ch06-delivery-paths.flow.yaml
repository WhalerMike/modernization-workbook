# Chapter 06 — three ways Intune delivers a certificate. The trusted certificate
# profile is deployed first on every path. SCEP from Cloud PKI and SCEP from AD CS
# both keep the private key on the device; PKCS generates the key on the
# Certificate Connector server and ships it to the device as a PFX.

  r: {tone: amber, width: 175, tag: "6 Repeat", title: "Renew", body: ["Before expiry, back to step 3: no one has to remember a date"], size: 12}
  x: {tone: red, width: 175, tag: "7 End", title: "Revoke or retire", body: ["Revoked through the CA template; the object is retired"], size: 12}
  ev: {kind: pill, tone: slate, text: "Every step is logged: events go to the SIEM, and the inventory is the evidence an assessor reads"}

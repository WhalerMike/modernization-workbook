# Appendix C — one certificate's life through the platform's components, and the evidence each step leaves.
rankdir: TB
graph: {nodesep: 0.22, ranksep: 0.4}
nodes:
  d: {tone: slate, width: 175, tag: "1 Find", title: "Discover", body: ["Network Discovery, CA Import, Server Agent"], size: 12}
  o: {tone: violet, width: 175, tag: "2 Own", title: "Place and own", body: ["Placement rules put it in a policy folder with a named Server Owner"], size: 12}
  e: {tone: blue, width: 175, tag: "3 Issue", title: "Enroll", body: ["The lifecycle engine asks the CA through its CA template driver"], size: 12}
  i: {tone: green, width: 175, tag: "4 Install", title: "Provision", body: ["An application driver or agent installs it on the target"], size: 12}

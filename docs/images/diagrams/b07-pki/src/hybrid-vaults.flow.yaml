# Hybrid credentials explainer — who renews what in each cloud's certificate service; keys and secrets stay with each cloud.
rankdir: TB
graph: {nodesep: 0.25, ranksep: 0.5}
clusters:
  - {id: clouds, label: "Each cloud's certificate service", tone: blue, nodes: [akv, acm, gcp]}
  - {id: keys, label: "Keys and secrets: owned by each cloud's own service, not the CLM", tone: red, nodes: [akvk, kms, gkms]}
nodes:
  clm: {tone: amber, width: 240, tag: "Certificate system of record", title: "CyberArk Certificate Manager", body: ["Issues from its CAs and pushes; or requests and monitors"], size: 12}
  akv: {tone: blue, width: 190, title: "Azure Key Vault", body: ["CLM pushes (Azure Government supported)", "One renewer per certificate"], size: 12}
  acm: {tone: blue, width: 190, title: "AWS ACM and Private CA", body: ["Imported: CLM renews", "ACM-issued: ACM renews, CLM monitors"], size: 12}
  gcp: {tone: blue, width: 190, title: "Google Cloud", body: ["CLM pushes load-balancer certificates", "Google-managed: Google renews"], size: 12}
  akvk: {tone: red, width: 190, title: "Key Vault keys and secrets", body: ["Azure RBAC"], size: 12}
  kms: {tone: red, width: 190, title: "AWS KMS, Secrets Manager", body: ["AWS IAM"], size: 12}
  gkms: {tone: red, width: 190, title: "Cloud KMS, Secret Manager", body: ["Google IAM"], size: 12}
edges:
  - [clm, akv]
  - [clm, acm, {both: true}]
  - [clm, gcp]
  - [akv, akvk, {style: invis}]
  - [acm, kms, {style: invis}]
  - [gcp, gkms, {style: invis}]

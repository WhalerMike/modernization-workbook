# software and hardware inventory and risk-matched assurance policies stay
# required; attestations and SBOM-on-request contract terms are agency
# choices. FedRAMP VDR and VER rules bind certified cloud providers from
# December 7, 2026 (grace to March 7, 2027). Verified in the chapter footnotes.

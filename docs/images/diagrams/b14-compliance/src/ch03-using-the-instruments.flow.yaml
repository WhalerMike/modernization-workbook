# questionnaire comes first (what is deployed and how it is certified); the
# crosswalk then points each control to its treatment; the gaps between the
# index and the baseline go to the system security plan. Program design.
rankdir: LR
graph: {nodesep: 0.3, ranksep: 0.2}
nodes:

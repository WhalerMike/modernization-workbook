  f: {tone: amber, width: 140, tag: "Step 2", title: "Flags and gaps", body: ["=Below the boundary level, not a cloud service, not certified, or missing"], size: 12}
  x: {tone: violet, width: 140, tag: "Step 3", title: "Crosswalk lookup", body: ["=For each control, the books that treat it and the evidence they name"], size: 12}
  s: {tone: green, width: 140, tag: "Step 4", title: "Plan and package", body: ["=Origination table, gaps the index doesn't cover, provider packages reused"], size: 12}
edges:
  - [q, f]
  - [f, x]
  - [x, s]

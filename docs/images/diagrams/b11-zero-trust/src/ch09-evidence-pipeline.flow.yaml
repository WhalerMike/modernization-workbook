# Chapter 09 — the four-stage evidence pipeline. Each assessment tool's
# unaltered output is normalized into provenance-wrapped claims, sealed into
# a deterministic bundle per interval, and emitted as OSCAL. Downstream
# uses fan out from the OSCAL stage; the next interval is compared for
# drift. The pipeline is the program's design.
rankdir: TB
graph: {nodesep: 0.25, ranksep: 0.3}
nodes:
  run: {tone: slate, width: 400, tag: "Stage 1", title: "Tool run", body: ["=ScubaGear or the Zero Trust Assessment; unaltered output, in boundary"], size: 12}
  claim: {tone: blue, width: 400, tag: "Stage 2", title: "Claim normalization", body: ["=Claim ID, issuer, classification, timestamp, lineage hash"], size: 12}
  seal: {tone: violet, width: 400, tag: "Stage 3", title: "Bundle and seal", body: ["=One interval, deterministic, hashed"], size: 12}
  oscal: {tone: green, width: 400, tag: "Stage 4", title: "OSCAL artifact", body: ["=Assessment results and POA&M items"], size: 12}
  dash: {kind: pill, tone: slate, text: "Indicator dashboard"}
  ssp: {kind: pill, tone: slate, text: "SSP narratives"}
  poam: {kind: pill, tone: amber, text: "POA&M items"}
edges:
  - [run, claim]
  - [claim, seal]
  - [seal, oscal]
  - [oscal, dash]
  - [oscal, ssp]
  - [oscal, poam]
  - [oscal, run, {label: "next interval, compared for drift", lw: 120, style: dashed, tone: violet, attrs: "constraint=false"}]

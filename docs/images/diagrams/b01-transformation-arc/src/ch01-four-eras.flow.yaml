# Chapter 01 — four eras of federal IT: one machine held one truth and enforced
# access to it; decentralization distributed the truth; consolidation and stacked
# security moved systems away from users; the cloud fragmented identity across
# environments. The way forward separates authoritative truth from enforcement.

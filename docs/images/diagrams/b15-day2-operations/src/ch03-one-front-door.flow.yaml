# Book 15 Chapter 03 — one front door. Every source of work (self-service
# catalog items, the redirected team mailbox, and tickets generated by the
# identity-governance platform or by monitoring) lands in one triage queue with
# no assignee. Triage classifies by the authority the task needs and routes to
# the ITSM pipeline, the IGA pipeline or escalation. Mail that claims to come
# from Microsoft is never actioned from the email. Program design.
rankdir: TB
graph: {nodesep: 0.3, ranksep: 0.4}
nodes:
  cat: {tone: slate, width: 220, tag: "Self-service", title: "Catalog item", body: ["=A user or manager raises a typed request"], size: 12}
  mail: {tone: slate, width: 220, tag: "Email", title: "Redirected team mailbox", body: ["=Transport rule sends team mail to the ITSM inbound address"], size: 12}
  gen: {tone: violet, width: 220, tag: "Generated", title: "Machine-raised tickets", body: ["=IGA requests the connector can't fulfil; monitoring alerts"], size: 12}
  q: {tone: slate, width: 460, tag: "Front door", title: "One triage queue, assignee blank", body: ["Email filters drop loops and junk", "A reroute rule pulls back anything assigned straight to cloud services"], size: 12}
  tri: {tone: amber, width: 460, tag: "Triage", title: "Classify by the authority the task needs", body: ["Not by who received it", "Mail claiming to be from Microsoft: A3, escalate only, verify in the audit log"], size: 12}
  itsm: {tone: blue, width: 220, tag: "A0 and A1", title: "ITSM pipeline", body: ["=Manager approves; connector action or help desk task"], size: 12}
  iga: {tone: violet, width: 220, tag: "A2 and A3", title: "IGA pipeline", body: ["=Owner approves; IGO for A3; connector or residual task"], size: 12}
  esc: {tone: red, width: 220, tag: "Out of scope", title: "Escalate", body: ["=Conditional Access, directory roles, service principals"], size: 12}
edges:
  - [cat, q]
  - [mail, q]
  - [gen, q]
  - [q, tri]
  - [tri, itsm, {tone: blue}]
  - [tri, iga, {tone: violet}]
  - [tri, esc, {tone: red}]
order:
  - [cat, mail, gen]
  - [itsm, iga, esc]

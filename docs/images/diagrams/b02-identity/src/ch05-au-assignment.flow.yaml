# Chapter 05 — how one scoped delegation is built: an HR-sourced attribute drives
# a dynamic AU's membership, a role-assignable group (assigned membership, never
# dynamic) holds the administrators, and the role assignment binds the two.
rankdir: LR
graph: {nodesep: 0.3, ranksep: 0.45}
nodes:
  attr: {tone: amber, width: 180, tag: "Source", title: "HR-sourced attribute", body: ["Organization code in `extensionAttribute10` on the user object"], size: 12}
  au: {tone: blue, width: 200, tag: "Scope", title: "Administrative unit", body: ["Dynamic rule over users", "Finance's organization codes in `extensionAttribute10`", "Restricted only if the population is sensitive"], size: 12}
  grp: {tone: blue, width: 200, tag: "Principal", title: "Role-assignable group", body: ["`Finance-Admins`", "Assigned membership; can't be dynamic", "Members eligible through PIM"], size: 12}
  ra: {tone: violet, width: 200, tag: "Binding", title: "Scoped role assignment", body: ["User Administrator", "`/administrativeUnits/{id}`"], size: 12}
edges:
  - [attr, au, {label: "membership rule", tone: amber}]
  - [grp, ra, {tone: violet}]
  - [ra, au, {label: "scope", tone: violet}]
order:
  - [attr, grp]

  net: {tone: red, width: 215, tag: "Types 6 to 9", title: "Network services", body: ["DNS and DHCP", "PKI and certificate services", "RADIUS and NPS", "LDAP-bound applications"], foot: "Fail silently when AD goes away", size: 12}

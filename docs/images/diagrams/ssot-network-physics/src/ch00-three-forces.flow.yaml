# Chapter 00 — three forces push toward logical centralization; physical
# centralization stops at the propagation floor.
rankdir: TB
graph: {nodesep: 0.25, ranksep: 0.4}
nodes:
  wan: {tone: blue, width: 200, title: "Fat, application-aware WAN", body: ["=Removes the latency penalty that kept data next to compute"], size: 12}
  tok: {tone: blue, width: 200, title: "Token-based (zero-trust) security", body: ["=One store can serve many trust domains; no sharding for security"], size: 12}
  ssot: {tone: blue, width: 200, title: "SSOT discipline", body: ["=Fewer authoritative copies: less drift, lower reasoning cost"], size: 12}
  logical: {tone: green, width: 300, title: "Logical centralization", body: ["=One source of truth; derived copies are subordinate"], size: 12}
  phys: {tone: amber, width: 200, title: "Physical centralization", body: ["=Only where physics allows: within a region"], size: 12}
  floor: {tone: red, width: 200, title: "Speed-of-light floor", body: ["=Immovable; no optimization touches it"], size: 12}

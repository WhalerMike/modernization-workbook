# Book 17 Chapter 06 — the credential order for an AI identity. The agent
# identity blueprint holds the credential for every agent identity created
# from it, so it is the credential boundary. Order: a managed identity as a
# federated identity credential where the agent runs on Azure; workload
# identity federation (or the Auth SDK sidecar) from the agent's own platform
# elsewhere; a certificate in a key vault or HSM; a client secret only for
# development and test. From Microsoft Learn (Agent 365 identity, create an
# agent identity blueprint, best practices for Agent ID); the policy rule that
# blocks secrets in production is program design.
rankdir: TB
graph: {nodesep: 0.35, ranksep: 0.3}
nodes:
  boundary: {tone: violet, width: 520, title: "The blueprint is the credential boundary", body: ["=Every agent identity created from it shares its credential"], size: 11}
  azure: {tone: amber, width: 300, title: "Does the agent run on Azure?", size: 11}
  mi: {tone: green, width: 240, tag: "First choice", title: "Managed identity", body: ["=Configured as a federated credential on the blueprint; no stored secret"], size: 11}
  issuer: {tone: amber, width: 300, title: "Does its platform issue tokens Entra ID can trust?", size: 11}
  wif: {tone: green, width: 240, tag: "Second choice", title: "Workload identity federation", body: ["=From the platform's issuer; record issuer and subject"], size: 11}
  cert: {tone: amber, width: 300, tag: "Third choice", title: "Certificate", body: ["=Key in a key vault or HSM; lifetime capped by policy; automated rotation"], size: 11}
  secret: {tone: red, width: 300, title: "Client secret", body: ["=Development and test only; blocked in production by an app management policy"], size: 11}
edges:
  - [boundary, azure]
  - [azure, mi, {label: "yes", tone: green}]
  - [azure, issuer, {label: "no"}]
  - [issuer, wif, {label: "yes", tone: green}]
  - [issuer, cert, {label: "no", tone: amber}]
  - [cert, secret, {label: "exception only", style: dashed, tone: red}]
ranks:
  - [azure, mi]
  - [issuer, wif]

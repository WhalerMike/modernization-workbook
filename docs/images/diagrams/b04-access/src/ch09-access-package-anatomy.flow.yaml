# Chapter 09 — anatomy of an access package: a catalog holds resources; a package
# bundles resource roles; policies set who can request, who approves, and when the
# assignment ends; reviews and expiry remove what is no longer justified.
rankdir: LR
graph: {nodesep: 0.3, ranksep: 0.4}
nodes:
  cat: {tone: violet, width: 130, tag: "Delegation", title: "Catalog", body: ["=Owned by a business owner; holds resources they own"], size: 12}
  ap: {tone: blue, width: 150, title: "Access package", body: ["Group membership", "Application role", "SharePoint site role"], size: 12}
  pol: {tone: blue, width: 165, title: "Assignment policy", body: ["Who can request", "Approval: one to three stages", "Requestor questions", "Expiry and extension", "Separation-of-duties checks"], size: 12}
  asg: {tone: green, width: 130, title: "Assignment", body: ["=Granted with an expiry date"], size: 12}
edges:
  - [cat, ap]
  - [ap, pol]
  - [pol, asg, {tone: green}]
  - [asg, ap, {label: "review: deny removes", style: dashed, tone: violet}]
  - [asg, pol, {label: "expiry removes", style: dashed, tone: violet}]

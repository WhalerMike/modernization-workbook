  res: {tone: blue, width: 240, tag: "Data plane", title: "Resource logs", body: ["Not collected by default", "One setting per resource, `allLogs` group", "Azure Policy DeployIfNotExists plus remediation tasks", "Resource-specific tables"], size: 11}
  ual: {tone: slate, width: 240, tag: "Microsoft 365", title: "Unified audit log", body: ["Check `Get-AdminAuditLogConfig` in Exchange Online PowerShell", "Management Activity API: five content types", "Kept 180 days or one year by license"], size: 11}
  ws: {tone: violet, width: 420, title: "One workspace, one verification loop", body: ["=Liveness queries per plane, policy compliance against the inventory, tenant-side audit check"], size: 12}

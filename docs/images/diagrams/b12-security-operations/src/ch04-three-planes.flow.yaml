# Book 12 Chapter 04 — three emission planes and three mechanisms. The Azure
# activity log (control plane) is exported by a subscription diagnostic
# setting; resource logs (data plane) need a setting per resource, enforced by
# Azure Policy DeployIfNotExists plus remediation tasks; the Microsoft 365
# unified audit log is verified in Exchange Online PowerShell and collected
# through the Office 365 Management Activity API. All three land in one
# workspace with one verification loop (program design). Facts cited in the
# chapter.
rankdir: TB

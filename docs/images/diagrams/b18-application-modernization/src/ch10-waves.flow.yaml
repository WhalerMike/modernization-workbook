# Book 18 Chapter 10 — running the application portfolio in waves on the
# program's phases and gates (Book 01, Chapter 12): Phase 0 Pre-flight
# (inventory and triage), Phase 1 Foundation (the factory: platform,
# patterns, pipelines), Phase 2 Pilot (a pilot wave), Phase 3 General rollout
# (factory waves), Phase 4 Legacy retirement (decommission the replaced
# applications and data stores), Phase 6 Steady state (long tail and
# re-triage). Small, low-complexity first waves and planning several waves
# ahead follow AWS Prescriptive Guidance and the Microsoft Cloud Adoption
# Framework; the mapping to the program's phases is the program's design.
rankdir: TB
graph: {nodesep: 0.3, ranksep: 0.3}
nodes:
  p0: {tone: slate, width: 300, tag: "Phase 0, Pre-flight · G0", title: "Inventory and triage", body: ["=Every application scored and given a disposition"], size: 11}
  p1: {tone: blue, width: 300, tag: "Phase 1, Foundation · G1", title: "Build the factory", body: ["=Platform, patterns, pipelines, validation tooling"], size: 11}
  p2: {tone: amber, width: 300, tag: "Phase 2, Pilot · G2", title: "Pilot wave", body: ["=A few low-complexity applications, plus one representative hard one"], size: 11}
  p3: {tone: blue, width: 300, tag: "Phase 3, General rollout · G3", title: "Factory waves", body: ["=Move groups by shared data and owner; plan four to five waves ahead"], size: 11}
  p4: {tone: red, width: 300, tag: "Phase 4, Legacy retirement · G4", title: "Decommission", body: ["=Retire replaced applications, DB2 and Oracle instances, licenses"], size: 11}
  p6: {tone: green, width: 300, tag: "Phase 6, Steady state", title: "Long tail and re-triage", body: ["=Retain with end dates; re-score on triggers"], size: 11}
  tri: {tone: violet, width: 230, title: "Re-triage triggers", body: ["End of support", "Incident or finding", "Cost or mission change"], size: 11}
edges:
  - [p0, p1]
  - [p1, p2]
  - [p2, p3, {label: "lessons into runbooks"}]
  - [p3, p4]
  - [p4, p6]
  - [tri, p0, {style: dashed, tone: violet, label: "re-score"}]
  - [p6, tri, {style: dashed, tone: violet}]

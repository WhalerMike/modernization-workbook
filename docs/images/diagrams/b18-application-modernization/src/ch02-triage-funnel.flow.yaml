# Book 18 Chapter 02 — triage at scale (program design). The inventory is
# scored from existing data, owners confirm or contest, the decision table
# proposes a disposition, and only contested or high-stakes applications get
# a deep study (decision table rule 7). The record feeds the enterprise
# architecture transition plan (A-130 §5.a(2)), capital planning
# (40 U.S.C. 11312) and wave planning (Chapter 10).
rankdir: TB
graph: {nodesep: 0.4, ranksep: 0.3}
nodes:
  inv: {tone: slate, width: 520, title: "The application inventory", body: ["=Every application with an owner: system inventory, configuration database, IT spending data"], size: 11}
  score: {tone: amber, width: 520, title: "Score from data", body: ["=Six criteria filled in from existing sources, each with a confidence flag"], size: 11}
  owner: {tone: amber, width: 520, title: "Owner review", body: ["=Mission owner and system owner confirm or contest the scores in a fixed window"], size: 11}
  prop: {tone: amber, width: 520, title: "Proposed disposition", body: ["=The decision table applied to the scores; first matching rule wins"], size: 11}
  study: {tone: red, width: 240, title: "Deep study", body: ["=Contested, high-cost or high-impact applications only"], size: 11}
  rec: {tone: green, width: 360, title: "Record the decision", body: ["=Disposition, scores, rule, owner's agreement, review date"], size: 11}
  feed: {tone: violet, width: 520, title: "Feed capital planning and the waves", body: ["=Enterprise architecture transition plan, budget requests, TMF proposals, Chapter 10"], size: 11}
edges:
  - [inv, score, {tone: slate}]
  - [score, owner, {tone: amber}]
  - [owner, prop, {tone: amber}]
  - [prop, rec, {tone: green, label: "most applications"}]
  - [prop, study, {tone: red, style: dashed, label: "rule 7"}]
  - [study, rec, {tone: green}]
  - [rec, feed, {tone: violet}]
ranks:
  - [rec, study]

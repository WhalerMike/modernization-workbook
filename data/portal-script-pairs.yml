# Portal | PowerShell pairs: each Microsoft Learn portal image in the guides (fig-learn-*) and the
# scripted step that does the same thing. scripts/portal_script_pairs.py writes the tabs into the
# pages and checks this file.
#
#   tab: exact     the script does what the screen shows
#        related   a related script; `relation` says how it differs (shown in the tab)
#        none      no tab; `reason` says why (a Learn diagram, or no script yet)
#   capture: wb/NN-k   an existing lab capture (data/kit-captures/, scripts/kit_captures.py)
#   run:               a command portal_script_pairs.py --capture runs on the kit's fixtures
#                      (the "Script captures" workflow runs it on a GitHub-hosted Windows runner)
#   command, needs     a command that needs a live tenant or device: shown, not captured
#   requirements       copied from the kit's requirements map (file, step); --check compares them

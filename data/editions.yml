# Editions of the Federal Modernization Workbook, oldest first.
#
# An edition is a git tag `edition-YYYY.MM` (a second cut in one month is
# `edition-YYYY.MM.N`) and a GitHub Release carrying that edition's built
# files. Cut one with scripts/cut_edition.py (see CONTRIBUTING.md, "Editions
# and the archive"); it drafts the entry below from the merged pull requests.
# Edit the summary and the change lines by hand; keep each line short.
#
# scripts/generate_revisions.py writes, from this file, each book's "Version
# and revision history" section and the Archive page (docs/about/archive.md).
# Its --check runs in the pull request checks.
#
# Entry shape:
#
#   - id: edition-2026.10
#     date: 2026-10-31
#     commit: <the tagged commit>
#     summary: One or two sentences on what this edition is.
#     units:                       # each book, guide or developer workbook that changed
#       b02-identity:              # its folder; guides/<name>, developer-workbooks/<name>
#         changes:
#           - Chapter 07 rewritten for the new sync client (#123)
#         version: "2.0"           # optional: start a new major version
#
# The Release's file list is in data/edition-assets/<id>.json
# (`python scripts/cut_edition.py --refresh-assets <id>`).


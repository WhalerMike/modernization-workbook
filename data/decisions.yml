# The workbook's decision register: one entry per decision the workbook's editor has made
# about the workbook's content, method and design, oldest first, from the repository's first
# pull request on. scripts/decisions/build.py turns it into docs/about/decision-register.md.
#
# Add a decision: append an entry with the next WD number, then run the build script.
# Change a decision: add a new entry and set the old one to `status: superseded` with
# `superseded_by`; don't rewrite the old choice. A reviewer's open challenge sets
# `status: challenged` and lists the issue numbers in `challenges`.
#
#   id            WD-NNN, never reused
#   date          the day it was decided (the merge date of the pull request that made it)
#   plan          optional: a project plan decision point it settles, as <plan slug>/<ID>
#   question      the question, in one sentence
#   options       the options considered
#   choice        what was chosen
#   rationale     why, as recorded; "Not stated in the PR" where the record gives no reason
#   basis         requirement (an external federal requirement), microsoft-learn, or
#                 workbook-design (the workbook's own judgment)
#   sources       original external sources, as {title, url}
#   pages         repository paths of the main pages it shaped (an #anchor is allowed)
#   prs           the pull requests that made or applied it
#   status        settled | challenged | superseded
#   superseded_by, challenges, note: as above

- id: WD-001
  date: 2026-10-18
  question: Should material about the original source system stay on the public site?
  options: [Keep it published, 'Take it off the site and neutralize names, hosts and paths']
  choice: Source-system runbooks, specs and security-package stubs come off the site. Branding, internal host names and personal paths are replaced with neutral placeholders such as example.internal.
  rationale: The folders describe the source system itself, not a modernization project, and the security-package pages were empty stubs. A neutral template set can be written later.
  basis: workbook-design
  sources: []
  pages: [CONTRIBUTING.md, docs/about/sources-and-verification.md]
  prs: [7, 8]
  status: settled

- id: WD-002
  date: 2026-10-18
  question: How are Word downloads produced?
  options: [Commit hand-built DOCX files, Convert rendered pages back to Markdown and join them, Build every bundle from the source Markdown with one manifest-driven builder]
  choice: No DOCX files are committed. One builder reads an ordered manifest, fails on a missing page or image, and fills the table of contents so it shows when the file opens in Protected View.
  rationale: The convert-back pipeline produced chopped text and broken figures, and committed copies duplicated what CI builds (about 51 MB removed). An empty table of contents never updates in Protected View.
  basis: workbook-design
  sources: []
  pages: [scripts/build_bundles.py, scripts/bundle-filter.lua, docs/downloads.md]
  prs: [9, 10, 12, 16, 44]
  status: settled


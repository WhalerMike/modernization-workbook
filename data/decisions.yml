  question: Which sources may support a claim, and how are weaker ones shown?
  options: [Primary sources only, Primary plus labelled third-party sources]
  choice: Claims are footnoted to primary sources (vendor documentation, OMB, CISA, NIST, IETF). A claim with no primary source is reworded or softened. Third-party sources are allowed only when labelled 'Third-party source' and listed apart.

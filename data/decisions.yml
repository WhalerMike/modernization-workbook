- id: WD-015
  date: 2026-10-19
  question: In what order does a leaver's access end?
  options: [Disable and clean up in one pass, 'Block first, then revoke, reconcile and dispose']
  choice: Disable the account, revoke sessions, then revoke PIV, device and access in parallel, reconcile, then dispose. Privileged leavers get their own block path. Revoking sessions stops new tokens only; issued tokens last until they expire.
  rationale: Not stated in the PRs beyond the ordering and the token-lifetime correction.

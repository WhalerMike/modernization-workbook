- id: WD-130
  date: 2026-11-03
  question: How does the Attribute-Driven Migration smoke test treat VK-DG-03, a validation kit check that can only run with delegated permissions?
  options: [Fail the smoke test when the check can't run, Drop the check from the smoke test, 'Accept it as a documented exception, verified by hand at the first live run']
  choice: Accept VK-DG-03 as a documented exception in the smoke test, and verify it by hand at the first live run.
  rationale: The smoke test runs app-only, so a delegated-only check always ends in error there. Failing on it would block every run; dropping it would lose the check. A documented exception keeps it visible.
  basis: workbook-design
  sources: []
  pages: [docs/books/b19-developer-workbook/10-deploying-to-test-and-production.md, docs/books/b19-developer-workbook/09-drift-pipelines-and-evidence.md]
  prs: [336]
  status: settled


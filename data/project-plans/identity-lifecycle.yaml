# Sample project plan: Identity Lifecycle & Provisioning (HR-driven identity).
# scripts/project_plans/build.py reads this file and writes the page, the
# Gantt chart and the downloads. Edit this file, never the outputs.
#
# Durations are working days and illustrative. This plan runs from week 1,
# alongside the program's Phase 0, because the program's Gate G1 needs the
# HR feed live for the foundation scope by week 8. Book 03's own Phases 0 to 3
# are compressed here to the foundation scope (the pilot cohort); Phases 4 to
# 6 then run with the program's pilot and rollout.

slug: identity-lifecycle
title: "Identity Lifecycle & Provisioning: HR-Driven Identity"
short_title: "Identity Lifecycle & Provisioning"
subtitle: "A sample project plan for Book 03's pipeline: from the integration-point inventory to cloud-mastered populations, with the decisions that hold the HR feed's critical path"
description: "A sample PMP-style project plan for the Identity Lifecycle & Provisioning project, built from Book 03, Chapter 12: a work breakdown by Book 03 phase, a computed critical path that shows why the HR feed is the program's most compressed track, every gate with its approver and criteria, and the intermediate decisions (enterprise identifier, contractor source, cutover populations) with owners and decide-by weeks."
plan_type: "Project"
covers: "Book 03 Phases 0 to 5 (Phase 6 is sustained posture)"
books: "Book 03"
sponsor: "Executive sponsor and CIO; HR leadership"
manager: "Identity engineering lead, with the agency HR 2.0 integrated project team point of contact"
start_label: "Week 1 = the program's Phase 0 approval"
project_start: 2027-01-04

purpose: |
  This plan builds [Book 03](../books/b03-hr-identity/index.md)'s pipeline: HR as the source of authority, a middleware in the agency's boundary, provisioning into Active Directory or Entra ID, and Lifecycle Workflows acting on the accounts. It follows Book 03's [phase model](../books/b03-hr-identity/12-execution-plan.md) gate for gate, and it feeds the [program master schedule](program-master-schedule.md): the program's Gate G1 needs this plan's Gate 3, the HR feed live for the foundation scope. The [implementation guide for Oracle Fusion Cloud HCM](../books/guides/hcm-entra-implementation.md) shows the same pipeline on named products.

critical_path_note: |
  The computed path runs through the integration-point inventory, the crosswalk, the authority map and schema, the middleware build, the end-to-end test and the shadow-mode observation. It is the most compressed track in the program: it has only a few days of float against the program's G1, so a week lost here is a week lost at G1. The privacy basis is the task to watch. It must be in place before production HR data flows at go-live, and many privacy offices need longer than this sample allows, so it starts on day one, not in Phase 1. If the agency's PIA update takes longer, re-baseline here first.

assumptions:
  - "The foundation scope is the pilot cohort, employees only; contractors join when their source is decided (D-I3)."
  - "Book 03's thresholds (for example 99% correlation on the pilot cohort) are proposed starting criteria, approved or replaced by the agency's risk governance ([Book 03, Chapter 12](../books/b03-hr-identity/12-execution-plan.md#sequencing-principle))."
  - "Lifecycle Workflows needs Entra ID Governance or Entra Suite licenses ([Book 03, Chapter 12](../books/b03-hr-identity/12-execution-plan.md#phase-2-pipeline-build-and-test))."
  - "Durations are illustrative. Phases 4 and 5 run per population, so their length follows the program's waves."

risks:
  - risk: "The privacy basis (routine use, PIA update) isn't ready at go-live"
    impact: "No production data can flow; G1 slips week for week"
    response: "Start it on day one; agree the minimized attribute set first (Book 03, Appendix B)"
  - risk: "HR data is wrong at the source"
    impact: "The pipeline provisions drifted access faster than tickets did"
    response: "Baseline and fix HR data in Phase 1, before automation (Book 03, Chapter 12)"
  - risk: "The correlation threshold isn't met on the pilot cohort"
    impact: "Gate 1 fails; the critical path waits"
    response: "Start correlation work in week 2 and report the rate weekly"
  - risk: "The contractor source stays undecided"
    impact: "Contractors stay on COR spreadsheets past wave 2"
    response: "Put D-I3 on the steering committee agenda before G2"


# Sample project plan: Endpoint & Device Modernization.
# scripts/project_plans/build.py reads this file and writes the page, the
# Gantt chart and the downloads. Edit this file, never the outputs.
#
# Durations are working days and illustrative. They follow the GPO sunset's
# reference plan in Book 05, Chapter 08 (a large fleet with a Configuration
# Manager estate), fitted to the program's weeks: the observation work feeds
# the program's G0, the pilot runs inside the program's Phase 2, the workload
# waves inside Phase 3, and the formal retirement ends in Phase 4.

slug: endpoint-device
title: "Endpoint & Device Modernization: Group Policy to Intune and Azure Arc"
short_title: "Endpoint & Device Modernization"
subtitle: "A sample project plan for Book 05: observe the fleet, author the policy library, pilot it beside the GPOs, cut each workload over, and retire the GPOs with evidence"
description: "A sample PMP-style project plan for the Endpoint & Device Modernization project, built from Book 05, Chapters 04 to 10: a work breakdown from observation to formal GPO retirement, a computed critical path through the policy library and the four workload waves, a gate per phase with its approver and criteria, and the decisions (path, Windows 10 posture, cut dates, Arc onboarding method) with owners and decide-by weeks."
plan_type: "Project"
covers: "Observe, author, pilot, workload cutover and formal retirement (Book 05, Chapter 08's seven phases)"
books: "Book 05"
sponsor: "Executive sponsor and CIO"
manager: "Project lead, with the four domain leads: device identity, Group Policy sunset, Conditional Access and NTLM"
start_label: "Week 1 = the program's Phase 0 approval"
project_start: 2027-01-04

purpose: |
  This plan moves the existing fleet from Group Policy and domain join to the governed device lifecycle in [Book 05](../books/b05-devices/index.md): workstations under Intune, servers under Azure Arc, and every setting owned by exactly one policy. It runs the GPO sunset in [Chapter 07](../books/b05-devices/07-the-gpo-sunset-program.md) at the working level of [Chapter 08](../books/b05-devices/08-gpo-to-intune-policy-migration.md), with [Chapter 09](../books/b05-devices/09-servers-under-azure-arc.md) for servers and [Chapter 10](../books/b05-devices/10-operating-and-evidencing-the-fleet.md) for the evidence. Net-new devices take the Intune-first path in [Chapter 04](../books/b05-devices/04-intune-first-onboarding.md) from the start. The plan feeds the [program master schedule](program-master-schedule.md): its pilot gate comes before the program's G2, its workload waves run in the program's Phase 3, and its GPO retirement closes in Phase 4. Domain unjoin of the existing fleet is a separate decision, outside this plan, as the [charter](https://github.com/WhalerMike/modernization-workbook/blob/main/docs/projects/endpoint-device-charter.md) sets out.

critical_path_note: |
  Two program gates bound the first half. The program's G1 (end of week 8) needs the Intune policy design, so the GPO export, the classification of every setting, the policy library and its peer review have to finish by then: they do, with one working day to spare, which is why the program carries its own Intune design on its critical path. The NTLM audit and Gate 0 sit one day off that path. The pilot then has to clear the program's G2 (end of week 16): devices moved, policies assigned beside the still-linked GPOs, four weeks of conflict and application testing, and the first setting class retired, with two days to spare.

  After G2 the computed critical path is the four workload waves in their fixed order (Endpoint Protection before device configuration, because the device configuration slider carries it), the residual cleanup, the 90-day hold on the disabled GPOs, and their archiving and deletion. The hold is the longest single item. It starts when the cleanup ends, in week 31, so the last deletions land at the end of week 44, with the program's G4. Waiting for G3 to start it would push the deletions to about week 50, past G5. The server waves, the NTLM stages and the inventory reconciliation all carry float.

assumptions:
  - "The fleet has a Configuration Manager estate, which is what Book 05's durations assume; a fleet without one skips most of the coexistence planning ([Chapter 08](../books/b05-devices/08-gpo-to-intune-policy-migration.md#the-seven-phases-at-working-level))."
  - "The pilot cohort is about 5% of the fleet, representative across tiers, regions and departments; the ring sizes in each wave are a program design choice."
  - "Domain unjoin of the existing fleet is out of scope; the sponsor schedules it separately ([Chapter 06](../books/b05-devices/06-who-owns-the-endpoint.md#the-roles))."
  - "The 90-day GPO retention window is the program's design choice, sized to the fleet's patch and refresh cycle ([Chapter 07](../books/b05-devices/07-the-gpo-sunset-program.md#freezing-and-unlinking-gpos)); here it is taken as 64 working days."
  - "Durations are illustrative. Replace them with the agency's own estimates once the GPO inventory and the NTLM audit are in."

risks:
  - risk: "NTLM is restricted before the audit window closes"
    impact: "Legacy applications break; the stage is rolled back and the NTLM track slips"
    response: "Restrict only after a 14 to 30 day audit shows no dependencies and the application owner signs off ([Chapter 05](../books/b05-devices/05-the-governed-manual-and-retrofit-paths.md#phase-3-restrict-ntlm-in-stages))"
  - risk: "A setting outside the Policy CSP (Defender, Windows Hello for Business) is configured in both a GPO and Intune"
    impact: "A race with no guaranteed winner; unexplained conflicts fail the pilot gate"
    response: "Never configure those settings in both places; unlink the GPO first or exclude the population ([Chapter 07](../books/b05-devices/07-the-gpo-sunset-program.md#coexistence-who-wins))"
  - risk: "Device attributes are incomplete"
    impact: "Devices fall outside every policy's scope, and the compliant-device policies can't be enforced"
    response: "Mark devices with no compliance policy as not compliant; reconcile the inventories weekly ([Chapter 10](../books/b05-devices/10-operating-and-evidencing-the-fleet.md#tenant-wide-compliance-settings))"
  - risk: "Pilot Intune doesn't remove policies when they are unassigned"
    impact: "A pilot rollback takes longer than planned"
    response: "Plan rollback as reassigning a policy that sets the old value, not as removing the assignment ([Chapter 08](../books/b05-devices/08-gpo-to-intune-policy-migration.md#rollback))"
  - risk: "An onboarding secret is left in plain text in a startup script"
    impact: "Anyone who reads SYSVOL can register servers into the subscription"
    response: "Onboard with a certificate-based service principal and remove the credential when each wave closes ([Chapter 09](../books/b05-devices/09-servers-under-azure-arc.md#create-the-onboarding-service-principal))"


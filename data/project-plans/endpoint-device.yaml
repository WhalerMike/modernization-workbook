  - {id: D-E1, kind: decision, phase: 0, name: "Path: manual, governed or retrofit", after: [E0.1], owner: "Sponsor / CIO",
     options: "Manual (small estate or pilot, no control plane yet); governed (larger estate, or the authorizing official must sign); retrofit (estate already modernized by hand)",
     late: "Nobody knows who holds the decision record; co-management for the pilot can't start",
     source: "../books/b05-devices/05-the-governed-manual-and-retrofit-paths.md#how-to-choose"}
  - {id: EG0, kind: gate, phase: 0, name: "Gate 0 — Observation signed off", after: [E0.1, E0.2, E0.3], owner: "CISO / ISSO",
     criteria: "Every linked GPO and setting inventoried; the NTLM audit window closed; SPNs inventoried with duplicates flagged; device records correlated and the loss ledger run",
     source: "../books/b05-devices/05-the-governed-manual-and-retrofit-paths.md#four-phases-observe-first"}
  # ------------------------------------------------- Phase 1 — classify and author

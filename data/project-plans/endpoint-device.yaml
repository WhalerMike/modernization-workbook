  - {id: D-E2, kind: decision, phase: 1, name: "Settings with no Intune equivalent", after: [E1.1], owner: "CISO / ISSO",
     options: "A Remediation script, reviewed later for a native replacement; a Configuration Manager baseline on co-managed devices; a dated exception with its GPO linked for that population only; a standing exception, accepted by the authorizing official",

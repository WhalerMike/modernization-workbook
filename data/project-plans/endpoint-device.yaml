  - {id: D-E3, kind: decision, phase: 1, name: "Windows 10 posture", after: [EG0], owner: "CISO / ISSO",
     options: "Upgrade to Windows 11 before the device's wave; keep the device as an exception with an upgrade date",
     late: "The compliance policies can't set their OS floor, so baseline authoring waits",
     source: "../books/b05-devices/08-gpo-to-intune-policy-migration.md"}
  - {id: D-E4, kind: decision, phase: 1, name: "Windows provisioning for net-new devices", after: [EG0], owner: "Endpoint engineering",
     options: "Classic Windows Autopilot, user-driven, Entra join, OEM or reseller registration with a group tag (the program's GCC default); Autopilot device preparation, with the attribute carried by the serial-number mapping table",

  - {id: E0.1, phase: 0, name: "Hybrid-join state checked (SCP, sync scope); fleet run against the loss ledger", dur: 8, owner: "Endpoint engineering",
     source: "../books/b05-devices/02-the-hybrid-join-trap.md#what-to-do-first"}
  - {id: E0.2, phase: 0, name: "Every GPO exported to Group Policy analytics, triaged to Intune or Arc scope; baseline per tier captured", dur: 12, owner: "Endpoint engineering",
     source: "../books/b05-devices/08-gpo-to-intune-policy-migration.md#phase-1-inventory-and-classify"}
  - {id: E0.3, phase: 0, name: "NTLM audit (stage 1) and SPN inventory, duplicates and stale owners flagged", dur: 20, owner: "Server infrastructure",

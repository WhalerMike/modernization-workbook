  - {id: D-E5, kind: decision, phase: 1, name: "Arc onboarding method", after: [EG0], owner: "Server infrastructure",
     options: "A certificate-based service principal through the tool the server team already runs (Configuration Manager, Ansible or Group Policy); the portal script for a handful of servers or a pilot; Arc-enabled VMware vSphere; the multicloud connector for AWS",
     late: "The pilot server wave can't create its credential",

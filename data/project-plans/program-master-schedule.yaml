# Sample project plan: the program's integrated master schedule.
# scripts/project_plans/build.py reads this file and writes the page
# (docs/project-plans/program-master-schedule.md), the Gantt chart and the
# CSV and Microsoft Project downloads. Edit this file, never the outputs.
#
# Durations are working days (5 a week) and are illustrative: they are sized
# so the gates land on the weeks Book 01, Chapter 12 gives. Predecessors are
# finish-to-start unless written "ID:SS" (start-to-start); "+N" adds N days of
# lag. Decisions and gates are zero-duration milestones.

slug: program-master-schedule
title: "Program Master Schedule: Phases 0 to 5 and Gates G0 to G5"
short_title: "Program master schedule"
subtitle: "A sample integrated master schedule for the whole program: seven phases, six gates, the critical path and the decisions that sit on it"
description: "A sample PMP-style integrated master schedule for the Federal Modernization Program, built from Book 00, Chapters 05 and 09 and Book 01, Chapter 12: a work breakdown by phase and workstream, a computed critical path, every gate with its approver and criteria, and the intermediate decisions that hold the path, each with an owner, a decide-by week and the cost of deciding late."
plan_type: "Program"
covers: "Phases 0 to 5 (Phase 6 is steady state)"
books: "Books 00 and 01"
sponsor: "Executive sponsor and CIO"
manager: "Steward (program office)"
start_label: "Week 1 = the week Phase 0 is approved"
project_start: 2027-01-04   # placeholder Monday for the Microsoft Project file only

purpose: |
  This is the program's top-level schedule: every phase, every gate and the decisions leadership has to make between them, as one network. It is the schedule the [complementary projects](index.md#the-plans) roll up to, and the one the steering committee tracks. It restates [Book 01, Chapter 12](../books/b01-transformation-arc/12-migration-roadmap.md) and [Book 00, Chapters 05](../books/b00-orientation/05-the-program-plan.md) and [09](../books/b00-orientation/09-design-pilot-and-rollout.md) as tasks with durations and dependencies, so the critical path is computed rather than asserted.

critical_path_note: |
  The computed path matches the one [Book 00, Chapter 05](../books/b00-orientation/05-the-program-plan.md#the-critical-path) traces: assessment, then the attribute taxonomy, dynamic groups and Intune design, then pilot devices, each rollout wave in turn, and the application-by-application retirement of AD-bound service principal names. Every week lost on it moves every later gate. Conditional Access, DNS, PKI and Arc work carry float: a slip there moves nothing until the float is used up, which is why they're tracked by float, not by date.

assumptions:
  - "One pilot division, then four waves of about a quarter of the estate each ([Book 00, Chapter 09](../books/b00-orientation/09-design-pilot-and-rollout.md#waves-defined-by-attribute-values))."
  - "Durations are illustrative and sized to the roadmap's weeks; replace them with the agency's own estimates from the Phase 0 assessment."
  - "The schedule assumes Phase 0 is approved without waiting for a vendor decision ([Start Here](../start-here.md))."
  - "The HR-to-cloud feed for the foundation scope comes from the [Identity Lifecycle plan](identity-lifecycle.md); its privacy basis is that plan's longest task."
  - "The source of authority for contractors is decided in the Identity Lifecycle plan (D-I3), which onboards contractor populations as their divisions move."

risks:
  - risk: "The assessment finds more than the plan assumed"
    impact: "Every gate moves; the assessment is on the critical path"
    response: "Run the read-only assessment in week 1; size Phase 1 from what it finds, and re-baseline at G0"
  - risk: "Report-only Conditional Access shows unexpected impact"
    impact: "Uses the CA track's float; G1 slips only if more than the float is used"
    response: "Start report-only in week 5, not week 7; read the sign-in logs weekly"
  - risk: "The privacy basis for the HR feed isn't ready"
    impact: "G1's HR-feed criterion fails"
    response: "Start the PIA update and the SORN routine-use check in Phase 0 (Identity Lifecycle plan)"
  - risk: "Applications can't leave AD-bound service principal names on time"
    impact: "G4 slips week for week"
    response: "Set the legacy-authentication end date early (D08) so application owners plan against it"


  - {id: IP4.4, phase: 4, name: "Copilot DLP enforced; paste to unapproved AI sites blocked; a labeled file cited but not summarized", dur: 10, after: [IP4.3, IP3.3], owner: "Operator",
     source: "../books/b20-information-protection/11-ai-data-security.md#b20-11-enforcement-ai"}
  - {id: IPG4, kind: gate, phase: 4, name: "Gate 4 — Insider risk and AI data governed", after: [IP4.2, IP4.4], owner: "ISSO",
     criteria: "Charter adopted before configuration; Insider Risk Management and Communication Compliance on for their scope after the audit phase, with users excluded only by the privacy official's approval; Copilot DLP enforced and AI-site paste blocked; approved AI apps and label exclusions recorded",
     source: "../books/b20-information-protection/12-operations-and-evidence.md#implementation-checklist"}
  # ------------------------------------------------- Phase 5 — operations and evidence
  - {id: IP5.1, phase: 5, name: "Configuration baseline exported and reviewed; drift run scheduled; first drift run with no unexplained differences", dur: 10, after: [IPG3], owner: "Platform owner",
     source: "../books/b20-information-protection/12-operations-and-evidence.md"}
  - {id: IP5.2, phase: 5, name: "Operating cadence written into the day-two runbook; quarterly synthetic tests run once; help desk briefed", dur: 5, after: [IPG3], owner: "Platform owner",
     source: "../books/b20-information-protection/12-operations-and-evidence.md#operating-cadence"}
  - {id: IP5.3, phase: 5, name: "Assessor's package assembled from the evidence catalog; Zero Trust Assessment rerun", dur: 10, after: [IP5.1, IP5.2, IPG4], owner: "ISSO",
     source: "../books/b20-information-protection/12-operations-and-evidence.md#evidence-catalog"}
  - {id: IPG5, kind: gate, phase: 5, name: "Gate 5 — Operated with evidence", after: [IP5.3], owner: "ISSO",
     criteria: "Every row of the implementation checklist ticked with the evidence the catalog names; first drift run clean; quarterly synthetic tests passed once; assessor's package assembled (closure is the authorizing official's decision)",
     source: "../books/b20-information-protection/12-operations-and-evidence.md#evidence-catalog"}


     source: "../books/b20-information-protection/11-ai-data-security.md#the-ai-data-decisions"}
  - {id: IP4.3, phase: 4, name: "Data risk assessment for oversharing read; DSPM and Copilot DLP in simulation for at least two weeks across a month-end", dur: 15, after: [D-IP9, IPG2], owner: "Platform owner",

     options: "Connected Cache for Enterprise and Education on its own host at each hub, its Azure resource placed in the boundary analysis; the Configuration Manager-integrated cache on a hub DP with no other roles (then retirement gate 4 binds it); none, where measured circuits carry cloud content",
     late: "Cloud content keeps crossing every hub circuit, and gate 4 has no plan",
     source: "../books/guides/dp-consolidation-implementation.md#step-9"}
  - {id: C7.1, phase: 7, name: "Cache hosts built at the hubs on a supported OS, nothing else on port 80; Delivery Optimization pointed at each office's hub cache", dur: 25, after: [D-C8, C6.1], owner: "Endpoint engineering",
     source: "../books/guides/dp-consolidation-implementation.md#step-9-1"}
  - {id: C7.2, phase: 7, name: "Cache hit rate measured; Win32 app, update and Microsoft 365 Apps content confirmed served from the hubs", dur: 10, after: [C7.1], owner: "Endpoint engineering",
     source: "../books/guides/dp-consolidation-implementation.md#step-9-2"}
  - {id: C7.3, phase: 7, name: "Connected Cache turned off on any DP hardware once the hub cache serves that office", dur: 5, after: [C7.2], owner: "Configuration Manager team",
     source: "../books/guides/dp-consolidation-implementation.md#step-9-3"}
  # ------------------------------------------------- Phase 8 — the five retirement gates
  - {id: RG1, kind: gate, phase: 8, name: "Retirement gate 1 — App content", after: [C6.2], owner: "Endpoint lead",
     criteria: "Client apps and Office Click-to-Run workloads on Intune for the whole validated population, and no required or available deployment still published from Configuration Manager",
     source: "../books/guides/dp-consolidation-implementation.md#step-10-1"}
  - {id: RG2, kind: gate, phase: 8, name: "Retirement gate 2 — Update content", after: [C6.3], owner: "Endpoint lead",
     criteria: "Windows Update policies and device configuration workloads on Intune, and Configuration Manager's software-update client setting off for those devices",
     source: "../books/guides/dp-consolidation-implementation.md#step-10-1"}
  - {id: RG3, kind: gate, phase: 8, name: "Retirement gate 3 — OS provisioning", after: [C6.4], owner: "Endpoint lead",
     criteria: "Bare-metal provisioning on Autopilot; no task sequence or PXE service still in use",
     source: "../books/guides/dp-consolidation-implementation.md#step-10-1"}
  - {id: RG4, kind: gate, phase: 8, name: "Retirement gate 4 — Caching role", after: [C7.3], owner: "Endpoint lead and ISSO",
     criteria: "No Connected Cache instance runs on distribution-point hardware, or none is needed on the measured circuits",
     source: "../books/guides/dp-consolidation-implementation.md#step-10-1"}
  - {id: RG5, kind: gate, phase: 8, name: "Retirement gate 5 — Compliance evidence", after: [C6.5], owner: "ISSO",

  - {id: C6.4, phase: 6, name: "Bare-metal provisioning moved from task sequences to Autopilot; PXE turned off on every DP", dur: 30, after: [D-C7], owner: "Endpoint engineering",
     source: "../books/guides/dp-consolidation-implementation.md#step-8-4"}
  - {id: C6.5, phase: 6, name: "Compliance and Endpoint Protection evidence sourced from Intune and Defender, not the Configuration Manager site database; ISSO confirms", dur: 15, after: [X-EG3], owner: "ISSO",

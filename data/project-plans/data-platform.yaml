# Sample project plan: Data Platform Identity Transformation (DRAFT).
# scripts/project_plans/build.py reads this file and writes the page, the
# Gantt chart and the downloads. Edit this file, never the outputs.
#
# Durations are working days and illustrative. The phases follow Book 06's
# runbook order (R01 to R10). Discovery runs from week 1, inside the
# program's Pre-flight; the pilot instance waits for the program's Arc
# pattern (P2.9); NTLM restriction waits for the authorizing official's end
# dates (program D08). The exception long tail runs past program week 48.

slug: data-platform
title: "Data Platform Identity Transformation: SQL Server from Windows Authentication to Entra ID"
short_title: "Data Platform Identity Transformation"
subtitle: "A sample project plan for Book 06's runbook sequence: the consolidation gate, the authentication audit, Arc and the parallel run, NTLM restriction, the application chain and the closure record"
description: "A sample PMP-style project plan for the Data Platform Identity Transformation project, built from Book 06 and its runbooks: a work breakdown by runbook phase, a computed critical path from the pilot instance to estate closure, every gate with its approver and criteria, and the intermediate decisions (consolidation verdicts, authentication standard, NTLM phase moves, connection-string cutover) with owners and decide-by weeks."
plan_type: "Project"
covers: "Book 06 Runbooks R01 to R10, from estate discovery to the closure record and the exception long tail"
books: "Book 06"
sponsor: "CIO and data leadership"
manager: "Data platform project lead, with the Database Authentication, Application-Tier Identity, Secrets Lifecycle and Evidence domain leads"
start_label: "Week 1 = the program's Phase 0 approval"
project_start: 2027-01-04

purpose: |
  This plan builds the [Data Platform Identity Transformation](../projects/data-platform-charter.md) project from [Book 06](../books/b06-data-platform/index.md): SQL Server moved from Windows and SQL authentication to Microsoft Entra ID, NTLM removed after audit, and the result kept as a continuously verified [closure record](../books/b06-data-platform/20-the-closure-condition.md). Its phases follow the book's [runbook order](../books/b06-data-platform/r01-prerequisites.md#step-5-the-run-order): discovery and the consolidation gate, the authentication audit, Arc and the parallel run on a pilot instance, the estate with NTLM restriction and the access layer, the application chain, then elimination and closure. It runs inside the [program master schedule](program-master-schedule.md): discovery belongs to the program's Pre-flight, the pilot host follows the program's server Arc pattern (P2.9), the group work builds on Gate G1, and NTLM restriction waits for the authorizing official's end dates (D08). Its tail, the instances that can only close by upgrade or retirement, runs past the program's week 48.

critical_path_note: |
  The computed path starts with the program's Arc pattern for pilot servers (P2.9, week 10). The pilot SQL Server host goes onto Arc after it; then come the Graph permissions, Entra authentication, the 30-day parallel run, the disable decision and Gate 2 in week 18. From there the path runs through the estate waves (D3.3), because a connection string can move only once its Entra login exists, then the application cutovers, Gate 4, the validation period, the Phase C block and Gate 5 in week 40. The exception long tail then runs to week 50, past the program's G5 in week 48. Book 06 supports that: the estate closes when every production instance has a satisfying record or a registered exception with a sunset date, and each excepted instance closes later by its own record. Discovery, the consolidation gate and the audit carry only about eight days of float against the Arc milestone, so the gate verdicts are near the path; Gate 3 and the application gate conditions (D4.2) are within five days of it. The NTLM deny step waits on the authorizing official's end dates (program D08, week 16). The application chain must be on Entra principals before the program finishes retiring AD-bound service principal names (P4.6, week 42); Gate 4 meets that with about eleven weeks of margin. Read against Book 06's own calendar date for the block, 2027-04-01, this sample's placeholder start puts the block in week 13, before the pilot's parallel run ends; that conflict is settled through D08, not by compressing the parallel run.

assumptions:
  - "Book 06 carries SQL Server. Other engines are inventoried only; the charter excludes non-relational platforms beyond inventory ([charter](../projects/data-platform-charter.md))."
  - "Executing a large consolidation is outside this plan. The verdict is in scope, but moving databases onto targets needs its own funding decision ([Book 06, Chapter 13](../books/b06-data-platform/13-who-owns-the-data-platform.md#where-the-roles-come-from))."
  - "Book 06 fixes the Phase C NTLM block at 2027-04-01, a program date, not a Microsoft one. This sample's calendar counts from Phase 0 approval, so the block sits where the network puts it, after the validation period; the authorizing official sets the actual date through program D08."
  - "The 30-day observation window holds in production; non-production may shorten it only with documented owner sign-off ([Book 06, Chapter 12](../books/b06-data-platform/12-the-engine-authentication-decision.md#decision-2-the-parallel-run-sequence-is-required))."
  - "Durations are illustrative. The estate waves run alongside the program's server Arc work (P3.7) and finish before its application-by-application SPN retirement (P4.6)."

risks:
  - risk: "The pre-2022 long tail is larger than the audit first suggests"
    impact: "The long tail outlasts the program; more instances run on the interim posture"
    response: "Decide upgrade or retire (D-D3) as soon as the audit is read; make most Category 3 instances retire or consolidation candidates (Book 06, Chapter 12)"
  - risk: "The parallel-run evidence is misread"
    impact: "A login is cut over while a client still uses Windows authentication, or a clean instance looks dirty"
    response: "Confirm on the pilot what auth_scheme shows for an Entra connection and filter out local connections before relying on the exit criteria (Runbook R05)"
  - risk: "AD CS is retired before a replacement CA issues"
    impact: "TLS certificates can't renew and the certificate-based interim posture is lost when it's needed most"
    response: "Run the certificate audit in week 9 (D5.1) and decide the issuer before any decommission date is set (Runbook R10)"
  - risk: "Conditional Access doesn't reach Arc-enabled SQL Server sign-ins as assumed"
    impact: "The MFA closure condition can't be evidenced; Gate 5 waits"
    response: "Confirm the Azure SQL Database target on the pilot instance (Runbook R07)"
  - risk: "An application has no Entra path today"
    impact: "Its host instance can't close"
    response: "Give it an owner, an effort band and a dated exception at triage (Book 06, Chapter 18)"

tasks:
  # ------------------------------------------------- Phase 0 — prerequisites and the consolidation gate
  - {id: D0.1, phase: 0, name: "Toolchain installed; evidence model and dated output directories under version control", dur: 5, owner: "Data platform team",
     source: "../books/b06-data-platform/r01-prerequisites.md#step-2-the-evidence-model"}
  - {id: D0.2, phase: 0, name: "Estate inventory, read-only: the audit seed, the SPN trail and the wider sweep, fused into one inventory", dur: 10, after: ["D0.1:SS+2"], owner: "Data platform team",
     source: "../books/b06-data-platform/r02-estate-discovery-and-consolidation-gate.md#step-1-build-the-estate-inventory-read-only"}
  - {id: D0.3, phase: 0, name: "Three rationalization lenses applied; consolidation constraints recorded", dur: 10, after: [D0.2], owner: "Data platform team",
     source: "../books/b06-data-platform/r02-estate-discovery-and-consolidation-gate.md#step-2-apply-the-three-rationalization-lenses-read-only"}
  - {id: D-D1, kind: decision, phase: 0, name: "Retain, consolidate or retire, instance by instance", after: [D0.3], owner: "CIO and data leadership",
     options: "Retain; consolidate into a target (the source is then retired); retire",
     late: "No login may be touched: the audit, Arc and login work all wait on the classified inventory",
     source: "../books/b06-data-platform/06-retain-consolidate-retire.md#the-three-classifications"}
  - {id: D-D2, kind: decision, phase: 0, name: "Consolidation target for each consolidated workload", after: [D0.3], owner: "CIO and data leadership",
     options: "SQL Server 2022 or 2025 on an Arc-enabled host; Azure SQL Managed Instance; Azure SQL Database or elastic pools. A dedicated target where a constraint blocks shared hosting",
     late: "Authentication would be migrated twice, once on the source and again on the target",
     source: "../books/b06-data-platform/06-retain-consolidate-retire.md#target-state-options"}
  - {id: DG0, kind: gate, phase: 0, name: "Gate 0 — Consolidation gate passed", after: [D-D1, D-D2], owner: "CIO and data leadership",
     criteria: "One row per instance, classified retain, consolidate or retire and justified by the three lenses; a target named for every consolidated workload; collation, vendor-version, compliance-isolation, failover-cluster and dependency constraints recorded; only retain instances and targets go on",
     source: "../books/b06-data-platform/r02-estate-discovery-and-consolidation-gate.md#step-3-the-retain-consolidate-retire-decision-the-gate"}
  # ------------------------------------------------- Phase 1 — the authentication audit and NTLM discovery
  - {id: D1.1, phase: 1, name: "Authentication audit of the surviving set: discovery pass, then the deep audit", dur: 8, after: [DG0], owner: "Data platform team",
     source: "../books/b06-data-platform/r03-the-authentication-audit.md#the-primary-script-spec3-d1.8-get-sqlserverauthaudit.ps1"}
  - {id: D1.2, phase: 1, name: "Audit read: Category 1, 2 or 3 per instance; blockers listed; failover cluster instances flagged", dur: 4, after: [D1.1], owner: "Data platform team",
     source: "../books/b06-data-platform/r03-the-authentication-audit.md#reading-the-result-migration-readiness"}
  - {id: D1.3, phase: 1, name: "NTLM Phase A baseline: SPN map and collisions, auth_scheme, host Security logs, Restrict NTLM audit policies, enhanced NTLM logging", dur: 20, after: [DG0], owner: "Data platform team",
     source: "../books/b06-data-platform/15-the-three-phases-of-ntlm-elimination.md#phase-a-discovery"}
  - {id: D-D3, kind: decision, phase: 1, name: "Upgrade or retire each pre-2022 retain instance", after: [D1.2], owner: "CIO and data leadership",
     options: "Upgrade to SQL Server 2022 or later and follow the Category 2-to-1 path; retire or consolidate it; keep it on a sunset-dated exception with the certificate-based interim posture (the authorizing official decides the exception)",
     late: "Category 3 instances have no path to Entra logins, and the exception long tail can't be sized",
     source: "../books/b06-data-platform/12-the-engine-authentication-decision.md#decision-4-pre-2022-instances-are-upgrade-or-except"}
  - {id: D-D4, kind: decision, phase: 1, name: "The engine authentication standard", after: [D1.2], owner: "CISO",
     options: "SQL authentication refused and sa disabled and renamed on every production instance, with break-glass as an empty Windows group; a type-S login kept past migration only as a dated exception with a named compensating control. Open-ended retention isn't an option",
     late: "Instances have no standard to cut over against, and the pilot can't be signed off",
     source: "../books/b06-data-platform/12-the-engine-authentication-decision.md#decision-3-sql-authentication-eliminated-sa-disabled-and-renamed"}
  - {id: DG1, kind: gate, phase: 1, name: "Gate 1 — Audit read and NTLM baselined", after: [D1.3, D-D3, D-D4], owner: "ISSO",
     criteria: "Every retain instance and target audited and placed in Category 1, 2 or 3 with its blockers; failover cluster instances treated as Category 3; the Phase A NTLM baseline ingested by compliance monitoring; the authentication standard set",
     source: "../books/b06-data-platform/08-reading-the-audit.md"}
  # ------------------------------------------------- Phase 2 — the pilot instance
  - {id: X-ARC, kind: external, phase: 2, name: "Pilot servers under Arc with machine configuration (program P2.9)", ref: "program-master-schedule:P2.9", owner: "Platform teams (program)",
     late: "The pilot SQL Server host has no Arc pattern to follow, and the pilot waits",
     source: "program-master-schedule.md"}
  - {id: D2.1, phase: 2, name: "Pilot host on Arc: egress confirmed, onboarding service principal, managed-identity token validated, SQL Server extension deployed", dur: 5, after: [DG1, X-ARC], owner: "Server infrastructure",
     source: "../books/b06-data-platform/r04-arc-deployment-and-managed-identity.md#step-1-enroll-the-host"}
  - {id: D2.2, phase: 2, name: "Graph permissions (SQL Server 2025) or admin consent (SQL Server 2022) granted by a Privileged Role Administrator", dur: 2, after: [D2.1], owner: "Identity team",
     source: "../books/b06-data-platform/r04-arc-deployment-and-managed-identity.md#roles-and-permissions"}
  - {id: D2.3, phase: 2, name: "Entra authentication on; Entra admin group set; Entra logins and users created beside the Windows ones", dur: 5, after: [D2.2], owner: "Data platform team",
     source: "../books/b06-data-platform/r05-login-migration-and-parallel-run.md#step-2-create-the-entra-database-users-beside-the-windows-users"}
  - {id: D2.4, phase: 2, name: "Parallel run: 30-day observation, recorded with SQL Server Audit", dur: 22, after: [D2.3], owner: "Data platform team",
     source: "../books/b06-data-platform/r05-login-migration-and-parallel-run.md#step-3-the-parallel-run"}
  - {id: D-D5, kind: decision, phase: 2, name: "Disable the superseded Windows logins on the pilot instance", after: [D2.4], owner: "Data platform team",
     options: "Disable, don't drop, once the window's exit criteria are met; extend the observation window",
     late: "The pilot can't cut over, and the estate waves have no proven pattern",
     source: "../books/b06-data-platform/r05-login-migration-and-parallel-run.md#step-4-cutover"}
  - {id: D2.5, phase: 2, name: "Cutover: Windows logins disabled, not dropped; sa disabled and renamed; scheduled audit started", dur: 3, after: [D-D5], owner: "Data platform team",
     source: "../books/b06-data-platform/r05-login-migration-and-parallel-run.md#the-sa-account"}
  - {id: DG2, kind: gate, phase: 2, name: "Gate 2 — Pilot instance on Entra authentication", after: [D2.5], owner: "ISSO",
     criteria: "Arc agent Connected; token audience https://database.windows.net/; SQL Server extension Succeeded; Entra admin set; every application and job seen on its Entra login; no remote NTLM rows; no connection arriving only on a legacy Windows login",
     source: "../books/b06-data-platform/r04-arc-deployment-and-managed-identity.md#verification-checklist"}
  # ------------------------------------------------- Phase 3 — the estate: logins, NTLM restriction, access layer
  - {id: X-G1, kind: external, phase: 3, name: "G1 — Foundation Complete: groups and AUs drift-clean, Conditional Access baseline enforced (program)", ref: "program-master-schedule:G1", owner: "Steward (program)",
     late: "The DBA administrative unit and the SQL group logins have no foundation to build on",
     source: "program-master-schedule.md"}
  - {id: D3.1, phase: 3, name: "DBA administrative unit with restricted management; Groups Administrator scoped to it, eligible through PIM", dur: 3, after: [X-G1, DG1], owner: "Identity team",
     source: "../books/b06-data-platform/r07-groups-aus-and-the-conditional-access-perimeter.md#sequencing-the-administrative-unit-comes-first"}
  - {id: D3.2, phase: 3, name: "Access groups and dynamic rules verified; group logins bound; Conditional Access perimeter confirmed on the pilot", dur: 15, after: [D3.1, DG2], owner: "Identity team",
     source: "../books/b06-data-platform/r07-groups-aus-and-the-conditional-access-perimeter.md#provision-attribute-based-dynamic-groups-entra-dynamic-groups"}
  - {id: D3.3, phase: 3, name: "Estate waves: every retain instance and target through Arc, Entra authentication, the parallel run and cutover", dur: 60, after: [DG2], owner: "Data platform team",
     source: "../books/b06-data-platform/11-three-principal-types.md#the-parallel-run-migration-pattern"}
  - {id: D3.4, phase: 3, name: "Phase B, step 1: SPNs registered and collisions repaired, linked-server passthrough replaced, LM and NTLMv1 refused", dur: 20, after: [DG1], owner: "Data platform team",
     source: "../books/b06-data-platform/r06-ntlm-detection-and-remediation.md#phase-2-remediation-review-required-patterns"}
  - {id: X-D08, kind: external, phase: 3, name: "End dates for legacy authentication and NTLM (program D08)", ref: "program-master-schedule:D08", owner: "Authorizing official (program)",
     late: "Phase B's deny step and the Phase C block have no date to plan against",
     source: "program-master-schedule.md"}
  - {id: D-D6, kind: decision, phase: 3, name: "Move Restrict NTLM from audit to deny, with exceptions from the Phase A baseline", after: [D3.4, X-D08], owner: "Authorizing official",
     options: "Deny, with the excepted instances in the domain controller and client lists; stay in audit; if a missed dependency surfaces, relax to audit or add a scoped exception",
     late: "NTLMv2 stays open, and Phase C has no restricted baseline to tighten",
     source: "../books/b06-data-platform/15-the-three-phases-of-ntlm-elimination.md#phase-b-restriction"}
  - {id: D3.5, phase: 3, name: "Phase B, step 2: Restrict NTLM deny settings staged on clients, servers and domain controllers", dur: 15, after: [D-D6], owner: "Server infrastructure",
     source: "../books/b06-data-platform/r06-ntlm-detection-and-remediation.md#phased-group-policy-restriction"}
  - {id: DG3, kind: gate, phase: 3, name: "Gate 3 — Estate on Entra logins, NTLM restricted", after: [D3.2, D3.3, D3.5], owner: "ISSO",
     criteria: "Every retain instance and target cut over after a clean parallel run; zero critical SPN collisions; Restrict NTLM deny in place with only documented exceptions; DBA administrative unit and group logins verified; a non-compliant sign-in to the SQL resource denied a token",
     source: "../books/b06-data-platform/15-the-three-phases-of-ntlm-elimination.md#phase-b-restriction"}
  # ------------------------------------------------- Phase 4 — the application chain
  - {id: D4.1, phase: 4, name: "LDAP-bind inventory over 30 days; each application placed on both axes", dur: 27, after: [DG1], owner: "Application owners",
     source: "../books/b06-data-platform/r08-application-chain-and-connection-strings.md#phase-1-inventory-the-ldap-bind-dependency-read-only-script-backed"}
  - {id: D-D7, kind: decision, phase: 4, name: "Class and database-axis column for each application", after: [D4.1], owner: "Application owners",
     options: "User axis: Class 3 OIDC, Class 2 SAML, Class 1 Application Proxy, Class 4 Entra Domain Services (last resort). Database axis: A configuration only, B code change, C vendor-dependent, D no Entra path today",
     late: "Neither migration track can be sequenced for the application",
     source: "../books/b06-data-platform/18-the-four-class-pattern-for-applications.md#two-axes-user-sign-in-and-the-database-connection"}
  - {id: D4.2, phase: 4, name: "Gate conditions prepared: identity holds its database role; change tested on a production-matching Arc stack", dur: 15, after: [D-D7, DG2], owner: "Application owners",
     source: "../books/b06-data-platform/r08-application-chain-and-connection-strings.md#the-three-gate-conditions"}
  - {id: D-D8, kind: decision, phase: 4, name: "Connection-string cutover, application by application", after: [D4.2, "D3.3:SS+20"], owner: "Application owners",
     options: "Cut over in a change window once all three gate conditions hold; fund the code change (column B); carry a dated exception (columns C and D, and Class 4)",
     late: "The application keeps its stored credential, and its host instance can't close",
     source: "../books/b06-data-platform/19-connection-string-migration.md#the-gate-conditions"}
  - {id: D4.3, phase: 4, name: "Connection strings cut over; prior configuration kept; legacy logins disabled, not dropped", dur: 45, after: [D-D8], owner: "Application owners",
     source: "../books/b06-data-platform/r08-application-chain-and-connection-strings.md#verification-and-rollback"}
  - {id: D4.4, phase: 4, name: "Exceptions filed for Class 4 and deferred applications, sunset dates reconciled against the NTLM block", dur: 5, after: [D-D7], owner: "ISSO",
     source: "../books/b06-data-platform/r08-application-chain-and-connection-strings.md#the-four-class-triage"}
  - {id: DG4, kind: gate, phase: 4, name: "Gate 4 — Application chain on Entra principals", after: [D4.3, D4.4], owner: "ISSO",
     criteria: "Every application in Classes 1 to 3 connects as its Entra principal, with no NTLM or KERBEROS rows; every Class 4 or deferred application's host instance carries a dated exception; no stored secret left in a production connection string outside a documented exception",
     source: "../books/b06-data-platform/r08-application-chain-and-connection-strings.md#verification-and-rollback"}
  - {id: X-P46, kind: external, phase: 4, name: "AD-bound service principal names migrated, retired or islanded (program P4.6)", ref: "program-master-schedule:P4.6", after: [DG4], owner: "Application owners (program)",
     late: "SQL Server's applications still hold Windows-authenticated connections when the program measures AD authentication for G4",
     source: "program-master-schedule.md"}
  # ------------------------------------------------- Phase 5 — elimination, closure and certificates
  - {id: D5.1, phase: 5, name: "Certificate audit; SQL Server's three AD CS dependencies mapped; CA-migration order derived", dur: 10, after: [DG1], owner: "Server infrastructure",
     source: "../books/b06-data-platform/r10-certificate-discovery-for-adcs.md#step-2-map-the-audit-to-sql-servers-three-dependencies"}
  - {id: D-D9, kind: decision, phase: 5, name: "Replacement CA and the AD CS decommission date for SQL Server's certificates", after: [D5.1], owner: "CIO and data leadership",
     options: "Book 07's issuers: the retained AD CS hierarchy through CyberArk Certificate Manager, moving to a standalone AD CS issuing CA under the same root when the forest retires; Microsoft Cloud PKI, which would need another enrollment path for SQL Server hosts. Either way, no decommission date until the replacement is issuing",
     late: "No decommission date can be set, and the certificate-based interim posture has no assured issuer",
     source: "../books/b06-data-platform/22-where-sql-server-touches-adcs.md#book-07-has-since-made-the-decision"}
  - {id: D-D10, kind: decision, phase: 5, name: "Phase C rule for instances whose interim posture isn't in place", after: [D4.4, D-D9], owner: "Authorizing official",
     options: "The Phase C date holds for them; dated exceptions with network-level isolation",
     late: "The long tail has no rule on the block date, and its exceptions can't be closed",
     source: "../books/b06-data-platform/15-the-three-phases-of-ntlm-elimination.md#phase-c-elimination"}
  - {id: D5.2, phase: 5, name: "Validation period: closure records and the six evidence sets live and satisfied; drift treated as a violation", dur: 40, after: [DG3, DG4, D-D10], owner: "Data platform team",
     source: "../books/b06-data-platform/r09-continuous-monitoring-and-closure.md#the-six-live-evidence-sets"}
  - {id: D5.3, phase: 5, name: "Phase C: Restrict NTLM set to deny across the estate", dur: 5, after: [D5.2, X-D08], owner: "Server infrastructure",
     source: "../books/b06-data-platform/15-the-three-phases-of-ntlm-elimination.md#phase-c-elimination"}
  - {id: DG5, kind: gate, phase: 5, name: "Gate 5 — Estate closed", after: [D5.3], owner: "CIO and data leadership",
     criteria: "All five closure conditions hold at once on every production instance; the six evidence sets satisfied across the validation period; every excepted instance in the registry with its justification, sunset date and own closure record; the scheduled audit still running",
     source: "../books/b06-data-platform/20-the-closure-condition.md#the-five-closure-conditions"}
  - {id: D5.4, phase: 5, name: "Exception long tail: pre-2022 and Class 4 instances upgraded, re-platformed or retired by their sunset dates", dur: 50, after: [DG5, D-D3], owner: "Data platform team",
     source: "../books/b06-data-platform/21-what-done-looks-like.md#a-consequence-not-a-completion-date"}


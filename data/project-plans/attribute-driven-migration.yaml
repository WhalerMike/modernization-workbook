# Sample project plan: Attribute-Driven Migration, the cross-track foundation.
# scripts/project_plans/build.py reads this file and writes the page, the
# Gantt chart and the downloads. Edit this file, never the outputs.
#
# Durations are working days and illustrative. The phases follow the nine
# stages of the Attribute-Driven Migration companion guide and its two
# technical deep-dive decks, plus PIV binding and the mover proof. This plan
# owns only what the four tracks share: the attribute schema and the AD-to-Entra
# mapping, the coded slots, the proof of the attributes, sync, the dynamic group
# library and administrative units, the Conditional Access personas, the device
# and server targeting conventions, the PIV binding, the mover proof, the
# retirement of the OU tree, and drift. The tracks keep their own plans: the HR
# track is Identity Lifecycle & Provisioning, the Intune and Arc tracks are
# Endpoint & Device (Arc is its Phase 4), and the non-person track is Non-Person
# Identity Modernization. Each handoff is an external milestone. Most of this
# plan's work lands just before the program task that consumes it (P1.1, P1.2,
# P1.5, P1.7, P2.2, P2.8), so those program tasks are its deadlines.

slug: attribute-driven-migration
title: "Attribute-Driven Migration: The Cross-Track Attribute Foundation"
short_title: "Attribute-Driven Migration"
subtitle: "A sample project plan for the attribute foundation the HR, Intune, Arc and non-person identity tracks share: one schema, one writer per attribute, attributes proven before anything reads them, and the OU tree retired once nothing depends on it"
description: "A sample PMP-style project plan for the cross-track foundation of the Attribute-Driven Migration companion guide and its two technical deep-dive decks: reading the OU tree, the attribute schema and AD-to-Entra mapping, the coded extension-attribute slots, proving the attributes, sync, the dynamic group library with its guards, administrative units, Conditional Access personas, device and server targeting conventions, PIV and CAC binding, the mover proof, cut-over and the OU tree's retirement, and drift. Handoffs to the track plans and the program's gates are linked milestones with computed margins; every decision has an owner and a decide-by week."
plan_type: "Project"
covers: "The nine stages of the companion guide, PIV binding and the mover proof: the parts the four tracks share, with the tracks themselves handed to their own plans"
books: "Books 01, 02, 03, 04, 05 and 07; the companion guide"
sponsor: "Executive sponsor and CIO; CISO"
manager: "Identity engineering lead, with the data architect, the HR integrated project team lead and the endpoint lead"
start_label: "Week 1 = the program's Phase 0 approval"
project_start: 2027-01-04

purpose: |
  This plan runs the shared foundation of the [Attribute-Driven Migration companion guide](../books/guides/attribute-driven-migration.md): the part of the move from Active Directory to Entra ID that no single track owns. In AD, an object's place in the OU tree decided what applied to it. In Entra ID, what the object says about itself decides. So the attributes have to be defined once, written by exactly one source, proved true, and only then read by groups, administrative units, Conditional Access, Intune and Azure Policy. The plan follows the guide's [nine stages](../books/guides/attribute-driven-migration.md#the-path-on-one-page) in the order the two technical deep-dive decks present them: [Part 1, the model and the HR track](../presentations/index.md#technical-attribute-driven-migration) ([▶ watch](../presentations/watch.html?v=Attribute_Driven_Migration_Technical_Part_1_Narrated)), and [Part 2, devices, servers, non-person identities and running the migration](../presentations/index.md#technical-attribute-driven-migration-part-2) ([▶ watch](../presentations/watch.html?v=Attribute_Driven_Migration_Technical_Part_2_Narrated)). The step-by-step work, with the validation kit check that proves each gate, is in [Attribute-Driven Migration: An Implementation Guide](../books/guides/attribute-driven-migration-implementation.md).

  It doesn't re-plan the four tracks. The HR track is the [Identity Lifecycle & Provisioning plan](identity-lifecycle.md), built through the research page [Building Book 03's HR Pipeline](../research/hcm-entra-implementation.md). The Intune and Arc tracks are the [Endpoint & Device plan](endpoint-device.md), with servers under Arc as its Phase 4. The non-person track is the [Non-Person Identity Modernization plan](non-person-identity.md). This plan takes from them the decisions it builds on (the HR plan's person key, authority map and mover automation) and hands them the conventions they build on (the slot register, device and server targeting, the key that records owners and sponsors). It runs inside the [program master schedule](program-master-schedule.md). Most of its work lands just before the program task that uses it: the attribute taxonomy (P1.1), the group and unit design (P1.2), the Conditional Access design (P1.5), the sync design (P1.7), the pilot assignments (P2.2) and PIV sign-in (P2.8). Its last phases follow the program's rollout to G3 and retire the OU tree before the program freezes AD (P5.1).

critical_path_note: |
  The computed critical path doesn't start in week 1. This plan's early work lands ahead of the program and track tasks that use it, so it carries float, and its finish is set by the program's rollout. The zero-float chain starts at the program's G3 (end of week 36). First the transitional sync rules that still read OU placement come out (A8.3). Once the program has retired the OU-based groups (P4.2, week 38), the OU tree is frozen (A8.4). The last full drift cycle then closes Gates 8 and 9 in week 40. The only way to finish sooner is a shorter rollout.

  Before G3, the plan works against deadlines in the program and the track plans, and the margins are what to watch. The tightest are two working days each: the pilot's shadow comparison (A4.4) before the program assigns the pilot's policies (P2.2), and the non-person conventions (A5.4) before the [Non-Person Identity](non-person-identity.md) plan starts recording sponsors (N1.2). Next, with four days each, come the device targeting conventions (A5.2) before the [Endpoint](endpoint-device.md) plan builds its policy library (E1.2), and Gate 0 before the program's G0. The schema waits on the [Identity Lifecycle](identity-lifecycle.md) plan's person key (D-I1) and attribute authority map (I1.2, week 3), and Gate 1 still reaches the program's attribute taxonomy (P1.1) with eight days in hand. The group library and unit design reach the program's group design (P1.2) with eight, the persona set reaches the Conditional Access design (P1.5) with twelve, and the PIV binding pilot reaches the program's PIV sign-in (P2.8) with ten. The mover proof waits on the HR plan's mover automation (I4.3, week 12) and closes 17 days before the program's G2. Gate 8 lands 20 working days before the program freezes AD (P5.1), and Gate 9 40 before G5. The writer of the PIV binding after AD (D-A7) can wait until week 39, when the program moves issuance off AD CS (P4.5). Deciding it earlier leaves time for the open pilot to report.

assumptions:
  - "The person key is decided in the [Identity Lifecycle plan](identity-lifecycle.md) (D-I1). This plan carries it in `employeeId` in both directories. Where the agency already has a long-standing enterprise identifier, such as a Mainframe PIN, that is the natural candidate ([Book 03, Chapter 04](../books/b03-hr-identity/04-attribute-authority.md#one-person-layered-identifiers))."
  - "Attribute slots follow the [program attribute map](../books/b03-hr-identity/06-canonical-attribute-schema.md#program-attribute-map): organization, worker type and position category in `extensionAttribute10` to `12`. Codes such as `FIN-LED` stand in for the agency's own code lists."
  - "Users stay AD-mastered and synced through most of this plan, so their attribute values are written in AD and read-only in Entra ID until each population becomes cloud-mastered ([companion guide, Stage 1](../books/guides/attribute-driven-migration.md#building-the-attributes-from-federal-hr-2.0))."
  - "The validation kit's checks are read-only and fixture-tested, not proven against a live tenant. Sync (VK-SYNC-01), the Conditional Access personas (VK-CA-01) and the PIV binding (VK-PIV-01) have checks that cover part of their gates; the rest of each gate's evidence is the export or report named in the implementation guide."
  - "Durations are illustrative. Most of this plan is design and verification work that lands just before a program task uses it; its finish follows the program's rollout."

risks:
  - risk: "A rule reads an attribute that more than one system writes"
    impact: "Access changes with whichever writer ran last, and drift can't be fixed at the source"
    response: "One writer per attribute in the slot register; other write paths removed before the first rule grants access (A1.3, A2.2; [Book 03, Chapter 06](../books/b03-hr-identity/06-canonical-attribute-schema.md#writers))"
  - risk: "A dynamic rule is written on a display name, or without guards"
    impact: "The group breaks when someone retypes a name, or includes disabled accounts and guests"
    response: "Rules on codes only, every rule with `accountEnabled` and `userType` guards, checked by the validation kit before any rule grants access (A4.2; [companion guide](../books/guides/attribute-driven-migration.md#dynamic-group-dangers))"
  - risk: "A soft or hard match overwrites cloud values with stale AD values"
    impact: "Coded attributes revert across a population at the next sync"
    response: "Clean AD first, keep both match types blocked outside a planned window (A3.1; [Book 02, Chapter 09](../books/b02-identity/09-building-the-entra-target.md#soft-match-and-hard-match))"
  - risk: "A Conditional Access persona includes a group built from an empty attribute"
    impact: "Users whose attribute is empty are silently outside the policy"
    response: "Pair every grant with a block, and report empty slots before enforcement (A5.1; [Book 04, Chapter 03](../books/b04-access/03-the-conditional-access-model.md#exclusions))"
  - risk: "The tenant is set to high-affinity PIV binding before every account's value is right"
    impact: "Card holders are locked out"
    response: "Measure binding coverage, then pilot high affinity before the tenant setting changes (A6.2; [companion guide](../books/guides/attribute-driven-migration.md#pki-binding))"
  - risk: "Entra ID's logs expire before an assessor asks for them"
    impact: "The evidence for the pilot's changes is gone, and the logs aren't retroactive"
    response: "Route logs outside Entra ID from the pilot's first day (A2.3; [Book 03, Chapter 11](../books/b03-hr-identity/11-drift-metrics-and-evidence.md#the-evidence-each-event-leaves))"


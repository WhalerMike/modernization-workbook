     source: "../books/guides/attribute-driven-migration.md#pki-binding"}
  - {id: X-P45, kind: external, phase: 6, name: "User and device issuance off AD CS; smart-card logon GPO retired (program P4.5)", ref: "program-master-schedule:P4.5", after: [D-A7], owner: "PKI lead (program)",

     criteria: "SBOMs, reports and statements signed and stored; Build L2 reached, then L3; contract clauses in the next acquisitions; residual supply chain risk owned by the authorizing official",
     source: "../books/b14-compliance/07-supply-chain-risk-management.md#who-owns-what"}


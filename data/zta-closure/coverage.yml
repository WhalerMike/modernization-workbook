# One entry per instruction ID in the workbook owner's anonymized "Zero Trust
# Assessment Closure Update Instructions" (November 2026): global conventions
# G-01..G-08, line-by-line updates B02-01..B18-02, the new Purview book's
# chapters (the instructions' nineteenth book, numbered 20 here because the
# workbook's Book 19 already exists), the three engineering topics carried as implementation guides
# instead of books (GSA, XDR, AZS), the closure-map rows CM-01..CM-15, and the
# Zero Trust Assessment tool guide (ZTA-GUIDE).
#
# This tracks WORKBOOK GUIDANCE coverage only. It says nothing about any
# tenant's implementation or any control's status: a page that carries an item
# gives guidance for it; whether an organization built it, and whether a finding
# is closed, is the organization's evidence and its authorizing official's call.
#
# Fields: id, title, wave (1-4 from the instructions' update priority, or null),
# book (B02..B20, "all", "guide" or a comma list), status (planned, implemented,
# partial, deferred, not-applicable), where (repo paths, with #anchors), pr
# (pull request number or null), note.

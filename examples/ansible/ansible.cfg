# Settings for running the examples from this folder. Ansible ignores an ansible.cfg in a
# world-writable directory (a Windows drive mounted in WSL, for one); there, point
# ANSIBLE_CONFIG at this file or copy the folder into your home directory.
[defaults]
inventory = inventory/cmdb_inventory.py
retry_files_enabled = false
# Reports and facts stay on the control node; nothing is cached on the targets.
gathering = explicit
host_key_checking = true
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml

[privilege_escalation]
# No task escalates unless it says become: true itself.
become = false

        revised: "2025-12-19"
    observed: "2026-01-05"
    confidence: attested
    status: current
  - id: R-FINDING-ABOUT-STATUS
    from: E-AUDIT-FINDING
    to: E-STATUS-CODE
    kind: governs
    basis: documented
    evidence:
      - ref: Oversight report, recommendation 3
        revised: "2026-03-02"
    observed: "2026-03-02"
    confidence: attested
    status: current
  - id: R-PORTAL-CALLS-CASE
    from: E-PORTAL
    to: E-CASE-APP
    kind: calls
    basis: planned
    evidence:
      - ref: Portal roadmap, release 7
        revised: "2026-08-12"
    confidence: attested
    status: planned
    target_date: "2027-03-31"

open_questions:
  - id: Q-VERIFY-FIELDS
    about: [R-VERIFY-READS-PERSON, E-VERIFY-SVC]
    question: Which person master fields does the partner verification service read, and is the status code among them?
    owner: Interface agreements team
    asked: "2026-10-14"

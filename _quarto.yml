        text: "Home"
      - href: docs/PRINCIPLES.md
        text: "Principles"
      - text: "Case Studies"
        menu:
          - href: docs/case-studies/README.md
            text: "All Case Studies"
          - href: docs/case-studies/sql-server-narrative/README.md
            text: "SQL Server Identity Transformation"
      - href: docs/compliance/index.md
        text: "Federal Compliance"
      - href: docs/operational-guides/index.md
        text: "Operational Guides"
      - text: "Series"
        menu:
          - href: docs/client-server-to-hybrid-cloud/README.md
            text: "Client-Server to Hybrid-Cloud"
          - href: docs/next-generation-ddi/index.md
            text: "Next Generation DDI"
          - href: docs/hr-driven-iam/index.md
            text: "HR-Driven Identity"
          - href: docs/sql-server-implementation/index.md
            text: "SQL Server Implementation Companion"
          - href: docs/executive-governance/index.md
            text: "Executive Governance"
          - href: docs/executive-briefs/index.md
            text: "Executive Briefs"
          - href: docs/ssot-network-physics/index.md
            text: "SSOT Network Physics"
          - href: docs/modernization-specs/README.md
            text: "Modernization Specs"
      - href: docs/whitepapers/README.md
        text: "Whitepapers"
      - text: "About"
        menu:
          - href: docs/HOW-TO-USE.md
            text: "How to Use This Workbook"
          - href: PROJECT-CHARTER.md
            text: "Project Charter"
          - href: PROJECT-PLAN.md
            text: "Project Plan"

project:
  type: website
  # Rebuilds _sitemap-tree.md (included by sitemap.qmd) from the pages
  # about to be rendered, so the Site Map always matches the site.
  pre-render: scripts/generate_sitemap.py
  # Writes forwarding pages for removed or merged URLs (scripts/redirects.yml).
  post-render: scripts/write_redirects.py
  output-dir: _site
  render:
    # The site publishes only the workbook books, the presentations, and the
    # home and site-map pages. Every other document stays in the repository,
    # unpublished, until the book that absorbs it is built (see
    # docs/books/index.md); books link to those sources on GitHub.
    - "index.qmd"
    - "sitemap.qmd"
    - "404.qmd"
    - "docs/books/**/*.md"
    - "docs/presentations/**/*.md"
  # Slide decks are published so the Presentations page can link them.
  resources:
    - "presentations/**/*.pptx"

website:
  title: "Modernization Workbook"
  site-url: https://whalermike.github.io/modernization-workbook/

  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true

  navbar:
    title: "Modernization Workbook"
    background: dark
    collapse-below: lg
    left:
      - href: index.qmd
        text: "Home"
      - text: "Books"
        menu:
          - href: docs/books/index.md
            text: "All books"
          - href: docs/books/b02-identity/index.md
            text: "Book 02 — Identity & Directory"
          - href: docs/books/b03-hr-identity/index.md
            text: "Book 03 — HR-Driven Identity"
          - href: docs/books/b04-access/index.md
            text: "Book 04 — Access & Privilege"
          - href: docs/books/b05-devices/index.md
            text: "Book 05 — Devices & Endpoints"
          - href: docs/books/b06-data-platform/index.md
            text: "Book 06 — Data Platform: SQL Server Identity"
          - href: docs/books/b07-pki/index.md
            text: "Book 07 — PKI & Certificates"
          - href: docs/books/b08-ddi/index.md
            text: "Book 08 — DNS, DHCP & IPAM"
      - href: docs/presentations/index.md
        text: "Presentations"
      - href: sitemap.qmd
        text: "Site Map"
    right:
      - href: https://github.com/WhalerMike/modernization-workbook
        text: "GitHub"
        icon: github

  sidebar:
    - id: books
      title: "The Workbook Books"
      style: docked
      collapse-level: 1
      contents:
        - docs/books/index.md
        - section: "Book 02 — Identity & Directory"
          href: docs/books/b02-identity/index.md
          contents:
            - auto: "docs/books/b02-identity/[0-9]*.md"
            - auto: "docs/books/b02-identity/appendix-*.md"
        - section: "Book 03 — HR-Driven Identity"
          href: docs/books/b03-hr-identity/index.md
          contents:
            - auto: "docs/books/b03-hr-identity/[0-9]*.md"
            - auto: "docs/books/b03-hr-identity/appendix-*.md"
        - section: "Book 04 — Access & Privilege"
          href: docs/books/b04-access/index.md
          contents:
            - auto: "docs/books/b04-access/[0-9]*.md"
            - auto: "docs/books/b04-access/appendix-*.md"
        - section: "Book 05 — Devices & Endpoints"
          href: docs/books/b05-devices/index.md
          contents:
            - auto: "docs/books/b05-devices/[0-9]*.md"
            - auto: "docs/books/b05-devices/appendix-*.md"
        - section: "Book 06 — Data Platform: SQL Server Identity"
          href: docs/books/b06-data-platform/index.md
          contents:
            - auto: "docs/books/b06-data-platform/[0-9]*.md"
            - auto: "docs/books/b06-data-platform/r[0-9]*.md"
            - auto: "docs/books/b06-data-platform/appendix-*.md"
        - section: "Book 07 — PKI & Certificates"
          href: docs/books/b07-pki/index.md
          contents:
            - auto: "docs/books/b07-pki/[0-9]*.md"
            - auto: "docs/books/b07-pki/appendix-*.md"
        - section: "Book 08 — DNS, DHCP & IPAM"
          href: docs/books/b08-ddi/index.md
          contents:
            - auto: "docs/books/b08-ddi/[0-9]*.md"
            - auto: "docs/books/b08-ddi/appendix-*.md"

  page-footer:
    left: "Modernization Workbook — topic books for federal IT modernization, each framed Why / What / Who / How."
    right:
      - href: https://github.com/WhalerMike/modernization-workbook
        text: "Source"

format:
  html:
    theme: cosmo
    toc: true
    fig-responsive: true
    fig-align: center
    link-external-newwindow: true
    link-external-icon: true
  docx:
    reference-doc: assets/reference-mslearn.docx
    toc: true
    toc-depth: 3
    fig-width: 6
    fig-height: 4
    fig-align: center

project:
  type: website
  # Rebuilds _workbook-map-tree.md (included by workbook-map.qmd) from the pages
  # about to be rendered, so the Workbook Map always matches the site.
  pre-render:
    - scripts/generate_workbook_map.py
    # Fills the Chapters, Pages and Last updated columns of the books table.
    - scripts/generate_book_metrics.py
    # Fills the How the books connect table on the Books page.
    - scripts/book_crosswalk.py
    # Lists every command in examples/ from the commands' own help.
    - scripts/command_reference.py
  # Writes forwarding pages for removed or merged URLs (scripts/redirects.yml).
  post-render: scripts/write_redirects.py
  output-dir: _site
  render:
    # The site publishes only the workbook books, the presentations, and the
    # home and Workbook Map pages. Every other document stays in the repository,
    # unpublished, until the book that absorbs it is built (see
    # docs/books/index.md); books link to those sources on GitHub.
    - "index.qmd"
    - "workbook-map.qmd"
    - "404.qmd"
    - "docs/start-here.md"
    # One page listing every download: kits, Word editions, videos.
    - "docs/downloads.md"
    - "docs/books/**/*.md"
    - "docs/presentations/**/*.md"
    - "docs/inspiration/**/*.md"
    - "docs/about/**/*.md"
    # The Command Reference, generated from the example kits' help, and the
    # crosswalks.
    - "docs/reference/**/*.md"
    # Training (learning paths) and Evaluations (product and technology
    # choices). Explainers and the newer guides live under docs/books/. Pages
    # not yet proved carry a status label (assets/research-banner.lua).
    - "docs/training/**/*.md"
    - "docs/evaluations/**/*.md"
    # The old Research landing page, kept so its URL still works: it says
    # where each type of page now lives.
    - "docs/research/index.md"
    # Sample project plans, generated from data/project-plans/ by
    # scripts/project_plans/build.py (see docs/project-plans/index.md).
    - "docs/project-plans/**/*.md"
  # The decks are on the current edition's Release (scripts/deck_assets.py), not the site.
  resources:
    - "presentations/start-here/Start_Here_720p.mp4"
    - "presentations/start-here/Start_Here_Narrated.vtt"
    - "presentations/start-here/Start_Here_poster.png"
    - "docs/inspiration/*.pdf"
    # Caption tracks and the manifest for the in-browser video players
    # (docs/presentations/watch.md, assets/fmw-video.lua). The MP4s stream
    # from the videos release; a caption track must come from the site itself.
    - "presentations/**/*_Narrated.vtt"
    # Each video's per-slide source links, fetched by the Watch page on demand.
    - "presentations/**/*_Narrated_sources.json"
    - "docs/presentations/videos.json"
    - "docs/presentations/fmw-chapters.js"
    - "docs/project-plans/files/*"
    - "docs/books/guides/files/*.csv"

# {{< fmw-video ID >}}: an in-browser video player (assets/fmw-video.lua).
shortcodes:
  - assets/fmw-video.lua


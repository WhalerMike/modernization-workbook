format:
  html:
    # Notes sit at the end of each page. Pandoc writes them without a heading,
    # so this adds a "Notes" heading, matching the Notes section that ends each
    # chapter in the Word bundles (scripts/bundle-filter.lua).
    reference-location: document
    include-after-body:
      - text: |
          <script>
            document.querySelectorAll("section#footnotes").forEach(function (s) {
              if (s.querySelector("h2")) return;
              var h = document.createElement("h2");
              h.id = "notes"; h.className = "fmw-notes-title"; h.textContent = "Notes";
              var hr = s.querySelector("hr");
              s.insertBefore(h, hr ? hr.nextSibling : s.firstChild);
              if (hr) hr.remove();
            });
          </script>
    # House theme (assets/fmw-theme.scss) and page header
    # (assets/partials/title-block.html + assets/fmw-hero.lua), in the style
    # of the Inspiration page.
    theme: [cosmo, assets/fmw-theme.scss]
    template-partials:
      - assets/partials/title-block.html
    filters:
      - assets/fmw-hero.lua
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    # Disclaimer banner at the top of every page, above the navbar.
    include-before-body:
      - text: |
          <div class="fmw-disclaimer" role="note" aria-label="Site disclaimer" style="background:#fff7e6;color:#5c3b00;border-bottom:1px solid #f0d9a8;font-size:.85rem;line-height:1.45;padding:.45rem 1rem;text-align:center;">
            <strong style="color:#3d2700;">This is not an official U.S. federal government website.</strong>
            The Federal Modernization Workbook is independent technical analysis. It does not represent the position of,
            and has not been reviewed or endorsed by, any federal agency.
          </div>
    toc: true
    fig-responsive: true
    fig-align: center
    link-external-newwindow: true
    link-external-icon: true
  docx:
    reference-doc: assets/reference-mslearn.docx
    toc: true
    toc-depth: 3
    fig-width: 6
    fig-height: 4
    fig-align: center

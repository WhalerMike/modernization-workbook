          - href: CONTRIBUTING.md
            text: "Contributing"
      - href: sitemap.qmd
        text: "Site Map"
    right:
      - href: https://github.com/WhalerMike/modernization-workbook
        text: "GitHub"
        icon: github

  # Section sidebars. A page shows the sidebar that lists it, which gives
  # every published page a menu path from the navbar. Globs pick up new
  # pages automatically; README.md files are listed by path because Quarto
  # skips README.md in globs.
  sidebar:
    - id: case-studies
      title: "Case Studies"
      style: docked
      collapse-level: 1
      contents:
        - docs/case-studies/README.md
        - docs/case-studies/index.md
        - section: "SQL Server Identity Transformation"
          href: docs/case-studies/sql-server-narrative/README.md
          contents:
            - docs/case-studies/sql-server-narrative/index.md
            - docs/case-studies/sql-server-narrative/series-overview.md
            - docs/case-studies/sql-server-narrative/Applicability.md
            - auto: "docs/case-studies/sql-server-narrative/Book_*.md"
            - auto: "docs/case-studies/sql-server-narrative/Appendix_*.md"
        - section: "Other case studies"
          contents:
            - auto: "docs/case-studies/*.md"

    - id: compliance
      title: "Federal Compliance"
      style: docked
      collapse-level: 1
      contents:
        - docs/compliance/index.md
        - section: "Series overview"
          contents:
            - docs/compliance/federal-compliance-series-overview.md
            - docs/compliance/federal-compliance-series-moderate-overview.md
            - docs/compliance/federal-compliance-series-moderate/README.md
            - docs/compliance/federal-compliance-series-moderate/executive-brief.md
            - docs/compliance/federal-compliance-series-moderate/executive-summary.md
            - docs/compliance/training-index.md
        - section: "Volume summaries"
          contents:
            - auto: "docs/compliance/federal-compliance-series-moderate/vol-*.md"
        - section: "Book lists"
          contents:
            - docs/compliance/federal-compliance-series-moderate/books/README.md
            - auto: "docs/compliance/federal-compliance-series-moderate/books/vol-*.md"
        - section: "Volume 0 — Executive Summary"
          contents:
            - auto: "docs/compliance/Vol_0_Book_*.md"
        - section: "Volume I — Foundation & Transport"
          contents:
            - auto: "docs/compliance/Vol_I_Book_*.md"
        - section: "Volume II — Data Platform"
          contents:
            - auto: "docs/compliance/Vol_II_Book_*.md"
        - section: "Volume III — Security Operations"
          contents:
            - auto: "docs/compliance/Vol_III_Book_*.md"
        - section: "Volume IV — Governance & Assurance"
          contents:
            - docs/compliance/Vol_IV_Book_00_Governance_Assurance_Overview.md
            - docs/compliance/Vol_IV_Book_01_Business_Continuity.md
            - docs/compliance/Vol_IV_Book_02_Supply_Chain_Risk_Management.md
            - docs/compliance/Vol_IV_Book_03_Program_Management_Governance.md
            - docs/compliance/Vol_IV_Book_04_PII_Processing_Transparency.md
            - docs/compliance/Vol_IV_Book_05_Cybersecurity_Training_Awareness.md
            # Its front matter sets a docx-only format, so link the HTML page

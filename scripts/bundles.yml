# Word bundles published under /downloads/ on every site deploy.
# Built by scripts/build_bundles.py (run it with --list to see each manifest).
#
# Manifest rules
#   output     File name under downloads/. Pages link to it as
#              <../ per folder level>downloads/<output>.
#   root       Folder the page paths are relative to. If the folder no longer
#              exists, the bundle is skipped (with a warning).
#   pages      Reading order. Each entry is either
#                - a literal path: it must exist, or the build fails; or
#                - a glob (*, ?, [..], ** for any depth): pages that match,
#                  in folder order (index.md and README.md first in each
#                  folder, then front-matter `order`/`series-order`, then
#                  natural name order, then sub-folders). Globs follow the
#                  folder, so adding or deleting pages never breaks the build.
#              A page is included once, at its first match. Pages the site
#              does not publish (see project.render in _quarto.yml) are skipped.
#   exclude    Globs removed from the result.
#   title      Title page. Default: the first page's front-matter title.
#   subtitle   Subtitle line. Default: defaults.subtitle.
#   aliases    Extra file names that get a copy of the same bundle.
#   image_dir  Optional: report images in this folder that the bundle does
#              not use.
#   warn_unlisted  Globs; warn if a published page matching one is not in
#              the manifest (catches pages added to an explicit manifest).

defaults:
  reference_doc: assets/reference-mslearn.docx
  toc_depth: 2
  subtitle: "Modernization Workbook — Word edition"

bundles:
  # ---------------------------------------------------------------------
  # SQL Server Identity Transformation narrative
  # ---------------------------------------------------------------------

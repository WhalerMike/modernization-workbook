# Every published page must be in a bundle, so its "Download (Word)" link and
# its "Other Formats > MS Word" link give the built file, not Quarto's raw
# export. The pages below are site only: navigation, generated link lists and
# tables too large for Word. build_bundles.py warns about any other published
# page that no bundle lists, and scripts/tests/test_build_bundles.py fails on it.
site_only:
  - index.qmd
  - 404.qmd
  - workbook-map.qmd
  - docs/start-here.md
  - docs/downloads.md
  - docs/books/index.md
  - docs/books/explainers/index.md
  - docs/training/index.md
  - docs/training/labs.md
  - docs/training/lab-setup.md
  - docs/project-plans/index.md
  - docs/project-plans/developer-workbooks/index.md
  - docs/evaluations/index.md
  - docs/reference/index.md
  - docs/reference/learn-coverage.md
  - docs/research/index.md
  - docs/presentations/index.md
  - docs/presentations/watch.md
  - docs/topics/*.md
  - docs/about/archive.md

    subtitle: "Why modernize, and why now — Federal Modernization Workbook, combined edition"
    root: docs/books/b00-orientation
    image_dir: docs/images/diagrams/b00-orientation
    warn_unlisted: ["*.md"]
    pages: [index.md, "[0-9][0-9]-*.md", "appendix-*.md"]
  - output: b01-transformation-arc-bundle.docx
    aliases: [client-server-to-hybrid-cloud-bundle.docx]

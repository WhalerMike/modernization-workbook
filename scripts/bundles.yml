    # index.md advertises the "standalone" name for the same document.
    aliases: [sql-server-narrative-standalone-bundle.docx]
    title: "SQL Server Identity Transformation"
    subtitle: "Narrative Series — combined edition"
    root: docs/case-studies/sql-server-narrative
    image_dir: docs/images/sql-server
    warn_unlisted: ["Book_*.md"]
    pages:
      - index.md
      - Book_01.md
      - Book_01_CPT_01.md
      - Book_01_CPT_02.md
      - Book_02.md
      - Book_02_CPT_01.md
      - Book_02_CPT_02.md
      - Book_02_CPT_03.md
      - Book_02_CPT_04.md
      - Book_03.md
      - Book_03_CPT_01.md
      - Book_03_CPT_02.md
      - Book_04.md
      - Book_04_CPT_01.md
      - Book_04_CPT_02.md
      - Book_05.md
      - Book_05_CPT_01.md
      - Book_05_CPT_02.md
      - Book_06.md
      - Book_06_CPT_01.md
      - Book_06_CPT_02.md
      - Book_07.md
      - Book_07_CPT_01.md
      - Book_07_CPT_02.md
      - Book_08.md
      - Book_08_CPT_01.md
      - Book_08_CPT_02.md
      - Book_09.md
      - Book_09_CPT_01.md
      - Book_09_CPT_02.md
      - Book_10.md
      - Book_10_CPT_01.md
      - Book_11.md                       # Book 11, the epilogue, is a single page

  # One bundle per book: the book page, then its chapters in order.
  - output: Book_01-bundle.docx
    subtitle: "SQL Server Identity Transformation — Narrative Series"
    root: docs/case-studies/sql-server-narrative
    pages: [Book_01.md, "Book_01_CPT_*.md"]
  - output: Book_02-bundle.docx
    subtitle: "SQL Server Identity Transformation — Narrative Series"
    root: docs/case-studies/sql-server-narrative
    pages: [Book_02.md, "Book_02_CPT_*.md"]

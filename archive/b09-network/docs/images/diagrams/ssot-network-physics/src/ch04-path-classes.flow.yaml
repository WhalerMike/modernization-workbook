# Chapter 04 — SD-WAN carries each class of database traffic on the path built
# for it; it narrows the gap but never goes below the floor.
rankdir: LR
graph: {nodesep: 0.3, ranksep: 0.5}
nodes:
  lean_t: {tone: blue, width: 210, tag: "Latency-critical", title: "Database traffic", body: ["Consensus heartbeats, leader election", "Synchronous-commit quorum acks", "Clock synchronization"], size: 12}
  fat_t: {tone: slate, width: 210, tag: "Bulk", title: "Database traffic", body: ["Base snapshots and backups", "Re-sync after a partition", "Analytics replication, async log shipping"], size: 12}
  lean: {tone: blue, width: 180, title: "Lean / low-latency path", body: ["=Shortest, least-congested path; minimum RTT and jitter"], size: 12}
  fat: {tone: slate, width: 180, title: "Fat / bulk path", body: ["=High bandwidth, cost-efficient, latency-tolerant"], size: 12}
  buys: {tone: green, width: 220, title: "What SD-WAN buys", body: ["Near-geodesic routing: floor × 3 toward floor × 1.1", "Tighter p99: FEC, packet duplication, jitter smoothing", "Bulk transfers can't starve quorum traffic"], size: 12}
  ceil: {tone: red, width: 220, title: "Hard ceiling", body: ["=It reaches the floor, never below it: New York ↔ London stays ≥ 56 ms per synchronous round trip"], size: 12}
edges:
  - [lean_t, lean, {tone: blue}]
  - [fat_t, fat]
  - [lean, buys]
  - [fat, buys]
  - [buys, ceil, {style: invis}]
ranks:
  - [buys, ceil]
